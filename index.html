    <!-- Early visit tracking (fires before React loads) - now authenticates anonymously first so it complies with Firestore security rules -->
    <script>
    (function () {
        try {
            if (sessionStorage.getItem('visited')) return;
            var today = new Date().toISOString().split('T')[0];
            var key = 'AIzaSyCYMLw1JplZjmgFRk5wswT0KRxVB6gyhsE';
            var authUrl = 'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + key;
            var base = 'https://firestore.googleapis.com/v1/projects/store-ba639/databases/(default)/documents';
            var docBase = base + '/artifacts/digital-store-v1/public/data';

            function getGeo() {
                return fetch('https://get.geojs.io/v1/ip/geo.json').then(function (r) { if (!r.ok) throw 0; return r.json(); })
                    .then(function (g) { return { country: (g && g.country) || 'Unknown', ip: (g && g.ip) || '' }; })
                    .catch(function () {
                        return fetch('https://ipwho.is/').then(function (r) { return r.json(); })
                            .then(function (g) { return { country: (g && g.country_code) || 'Unknown', ip: (g && g.ip) || '' }; })
                            .catch(function () { return { country: 'Unknown', ip: '' }; });
                    });
            }

            Promise.all([
                getGeo(),
                fetch(authUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }) }).then(function (r) { return r.json(); }).catch(function () { return null; })
            ]).then(function (results) {
                var geo = results[0], authRes = results[1];
                var country = geo.country, ip = geo.ip;
                var idToken = authRes && authRes.idToken;
                if (!idToken) return; // no auth = writes will be rejected by security rules, let React handle it later
                var headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken };
                fetch(base + ':commit?key=' + key, { method: 'POST', headers: headers,
                    body: JSON.stringify({ writes: [
                        { transform: { document: docBase + '/stats/general', fieldTransforms: [{ fieldPath: 'totalVisits', increment: { integerValue: '1' } }] } },
                        { transform: { document: docBase + '/stats/daily_' + today, fieldTransforms: [
                            { fieldPath: 'totalVisits', increment: { integerValue: '1' } },
                            { fieldPath: 'countries.' + country, increment: { integerValue: '1' } }
                        ] } }
                    ] }) }).then(function (res) {
                        if (res.ok) sessionStorage.setItem('visited', 'true');
                    }).catch(function () {});
                // visit log entry with IP
                fetch(docBase + '/visits?key=' + key, { method: 'POST', headers: headers,
                    body: JSON.stringify({ fields: {
                        ip: { stringValue: ip }, country: { stringValue: country },
                        ua: { stringValue: navigator.userAgent }, ts: { integerValue: String(Date.now()) }
                    } }) }).catch(function(){});
            }).catch(function(){});
        } catch (e) {}
    })();
    </script>

        const useCountry = () => {
            const [countryCode, setCountryCode] = useState(() => {

            }); 
            
            useEffect(() => {
                const detectCountry = async () => {
                    try {
                        const res = await fetch('https://get.geojs.io/v1/ip/country.json');
                        if (res.ok) {
                            const data = await res.json();
                            if (data.country) {
                                setCountryCode(data.country);
                                localStorage.setItem(STORAGE_KEYS.USER_COUNTRY, data.country);
                                return;
                            }
                        }
                    } catch (e) { console.warn("GeoJS failed", e); }
                    
                    try {
                        const res = await fetch('https://ipapi.co/json/');
                        if (res.ok) {
                            const data = await res.json();
                            if (data.country_code) {
                                setCountryCode(data.country_code);
                                localStorage.setItem(STORAGE_KEYS.USER_COUNTRY, data.country_code);
                                return;
                            }
                        }
                    } catch (e) { console.warn("ipapi failed", e); }
                };

                detectCountry();
            }, []);

            return countryCode;

            const msgBuffer = new TextEncoder().encode(message);

            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        // The Firebase JS SDK (both onSnapshot AND getDoc/getDocs) talks to Firestore over a
        // persistent "WebChannel" connection. On some mobile networks / carriers / browsers /
        // ad-block or privacy extensions that channel gets silently blocked or returns cached/
        // empty data, while a normal one-shot HTTPS GET to the Firestore REST API works fine
        // (this was verified directly). These helpers bypass the SDK's data channel entirely
        // and talk to the REST API with plain fetch(), reusing the SDK's own auth token.
        const FIRESTORE_REST_BASE = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents`;

        const restFieldToJs = (field) => {
            if (!field) return null;
            if ('stringValue' in field) return field.stringValue;
            if ('integerValue' in field) return parseInt(field.integerValue, 10);
            if ('doubleValue' in field) return field.doubleValue;
            if ('booleanValue' in field) return field.booleanValue;
            if ('mapValue' in field) {
                const obj = {};
                const fields = (field.mapValue && field.mapValue.fields) || {};
                Object.keys(fields).forEach(k => { obj[k] = restFieldToJs(fields[k]); });
                return obj;
            }
            if ('arrayValue' in field) {
                const values = (field.arrayValue && field.arrayValue.values) || [];
                return values.map(restFieldToJs);
            }
            if ('nullValue' in field) return null;
            return null;
        };

        const restDocToJs = (doc) => {
            const obj = {};
            const fields = doc.fields || {};
            Object.keys(fields).forEach(k => { obj[k] = restFieldToJs(fields[k]); });
            if (doc.name) obj.id = doc.name.split('/').pop();
            return obj;
        };

        const getRestAuthHeaders = async () => {
            try {
                if (auth && auth.currentUser) {
                    const token = await auth.currentUser.getIdToken();
                    return { 'Authorization': `Bearer ${token}` };
                }
            } catch (e) { console.warn('getIdToken failed', e); }
            return {};
        };

        const restGetDoc = async (segments) => {
            const headers = await getRestAuthHeaders();
            const url = `${FIRESTORE_REST_BASE}/${segments.join('/')}?key=${firebaseConfig.apiKey}`;
            const res = await fetch(url, { headers });
            if (!res.ok) { if (res.status === 404) return null; throw new Error('restGetDoc ' + res.status); }
            const data = await res.json();
            return restDocToJs(data);
        };

        const restListCollection = async (segments) => {
            const headers = await getRestAuthHeaders();
            let all = [];
            let pageToken = '';
            for (let i = 0; i < 20; i++) { // safety cap: up to 20 pages (~6000 docs)
                const url = `${FIRESTORE_REST_BASE}/${segments.join('/')}?key=${firebaseConfig.apiKey}&pageSize=300` + (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : '');
                const res = await fetch(url, { headers });
                if (!res.ok) throw new Error('restListCollection ' + res.status);
                const data = await res.json();
                const docs = (data.documents || []).map(restDocToJs);
                all = all.concat(docs);
                if (!data.nextPageToken) break;
                pageToken = data.nextPageToken;
            }
            return all;

                const docName = `projects/${firebaseConfig.projectId}/databases/(default)/documents/${segments.join('/')}`;

                    body: JSON.stringify({

        const HeroCarousel = ({ slides, lang, onSlideClick }) => {
            const [current, setCurrent] = useState(0);
            const touchStartX = React.useRef(null);
            const count = slides.length;
            useEffect(() => {
                if (count <= 1) return;
                const timer = setInterval(() => setCurrent(prev => (prev + 1) % count), 5000);
                return () => clearInterval(timer);
            }, [count]);
            if (!count) return null;
            const t = translations[lang];
            const goTo = (i) => setCurrent((i + count) % count);
            const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
            const onTouchEnd = (e) => {
                if (touchStartX.current === null) return;
                const delta = e.changedTouches[0].clientX - touchStartX.current;
                if (delta > 50) goTo(current - 1);
                else if (delta < -50) goTo(current + 1);
                touchStartX.current = null;
            };
            return (
                <div className="relative w-[100vw] left-1/2 -translate-x-1/2 h-36 sm:h-44 md:h-72 overflow-hidden shadow-lg group animate-fade-in" dir="ltr"
                    onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
                    <div className="flex h-full transition-transform duration-700 ease-in-out" style={{ transform: `translateX(-${current * 100}%)` }}>
                        {slides.map((slide, i) => (
                            <div key={slide.id || i} className="w-full h-full flex-shrink-0 relative bg-white">
                                {slide.imageUrl && <img src={slide.imageUrl} alt="" className="w-full h-full object-cover" loading="lazy" draggable="false" />}
                                <div className="absolute inset-x-0 bottom-0 h-1/3 bg-gradient-to-t from-slate-900/25 to-transparent pointer-events-none"></div>

                                    <h2 className="text-base sm:text-xl md:text-3xl font-black mb-0.5 md:mb-2 text-slate-900 [text-shadow:_0_1px_4px_rgb(255_255_255_/_70%)]">{(lang === 'en' && slide.title_en) ? slide.title_en : slide.title}</h2>
                                    {slide.subtitle && <p className="text-[11px] md:text-base text-slate-700 font-bold mb-1.5 md:mb-4 [text-shadow:_0_1px_4px_rgb(255_255_255_/_70%)] line-clamp-1">{(lang === 'en' && slide.subtitle_en) ? slide.subtitle_en : slide.subtitle}</p>}
                                    <button onClick={() => onSlideClick(slide)} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 md:px-6 md:py-2.5 rounded-xl font-bold shadow-lg transition text-xs md:text-base">{t.viewOffer}</button>
                                </div>
                            </div>
                        ))}
                    </div>
                    {count > 1 && <>
                        <div className="absolute bottom-2.5 left-1/2 -translate-x-1/2 z-20 flex gap-2">
                            {slides.map((_, i) => <button key={i} onClick={() => goTo(i)} aria-label={'slide ' + (i+1)} className={`w-2 h-2 md:w-2.5 md:h-2.5 rounded-full transition ${i === current ? 'bg-white scale-110' : 'bg-white/40 hover:bg-white/70'}`} />)}
                        </div>
                    </>}
                </div>
            );
        };

        const AdminProductItem = ({ product, onDelete, onEdit, onToggleUnavailable, onDropItem, onTouchStartItem, touchOver, dragging, lang }) => {
            const [isDragOver, setIsDragOver] = useState(false);
            return (
            <div draggable data-product-id={product.id}
                onDragStart={(e) => { e.dataTransfer.setData('text/plain', product.id); e.dataTransfer.effectAllowed = 'move'; }}
                onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }}
                onDragLeave={() => setIsDragOver(false)}
                onDrop={(e) => { e.preventDefault(); setIsDragOver(false); const draggedId = e.dataTransfer.getData('text/plain'); if (draggedId && draggedId !== product.id) onDropItem(draggedId, product.id); }}
                onDragEnd={() => setIsDragOver(false)}
                className={`bg-white dark:bg-slate-800 p-4 rounded-xl border shadow-sm flex flex-col md:flex-row items-center gap-4 transition ${(isDragOver || touchOver) ? 'border-blue-500 dark:border-blue-400 ring-2 ring-blue-200 dark:ring-blue-900 scale-[1.01]' : 'border-slate-200 dark:border-slate-700'} ${dragging ? 'opacity-50' : ''}`}>

                <div onTouchStart={(e) => onTouchStartItem(product.id)} className="cursor-grab active:cursor-grabbing touch-none text-slate-300 dark:text-slate-500 hover:text-slate-500 dark:hover:text-slate-300 select-none flex-shrink-0 text-xl leading-none px-1" title={translations[lang].dragToReorder || ''}>&#x2807;&#x2807;</div>
                <div className="w-16 h-16 bg-white dark:bg-slate-700 rounded-lg border border-slate-100 dark:border-slate-600 flex-shrink-0 overflow-hidden flex items-center justify-center p-2">

                    <button aria-label={translations[lang].edit} onClick={() => onEdit(product)} className="p-2 text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition"><Edit className="w-5 h-5" /></button>

                </div>

            );

        const VisitorsLogPage = ({ lang, onBack, isOfflineMode, stats, productViews, products }) => {
            const [visits, setVisits] = useState([]);
            const [loadingVisits, setLoadingVisits] = useState(true);
            const [visitsSource, setVisitsSource] = useState('cloud');
            const t = translations[lang];
            const normalizeCountry = (c) => {
                if (!c) return 'Unknown';
                const raw = String(c).trim();
                if (raw.length === 2) return raw.toUpperCase();
                const names = { egypt: 'EG', 'saudi arabia': 'SA', 'united arab emirates': 'AE', kuwait: 'KW', qatar: 'QA', bahrain: 'BH', oman: 'OM', lebanon: 'LB', jordan: 'JO', iraq: 'IQ', libya: 'LY', morocco: 'MA', 'united states': 'US', 'united kingdom': 'GB', germany: 'DE', france: 'FR', turkey: 'TR' };
                return names[raw.toLowerCase()] || raw;
            };

            const fetchVisitsOnce = async () => {
                // Uses a plain HTTPS REST GET (restListCollection), NOT the Firebase SDK's
                // getDocs/onSnapshot data channel. On this app's traffic, the SDK's own
                // WebChannel returns stale/empty/local-only results on some networks & browsers,
                // while the REST endpoint (verified directly) always returns the true server data.
                try {
                    const list = await restListCollection(['artifacts', appId, 'public', 'data', 'visits']);
                    list.forEach(v => { v.country = normalizeCountry(v.country); });
                    list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
                    setVisits(list);
                    setVisitsSource('cloud');
                    setLoadingVisits(false);
                    return true;
                } catch (e) {
                    console.warn('restListCollection(visits) failed', e);
                    return false;
                }
            };

            useEffect(() => {
                // Always try the public REST API first. Offline mode must not hide cloud visits.
                let cancelled = false;
                const run = async () => {
                    const ok = await fetchVisitsOnce();
                    if (cancelled) return;
                    if (!ok) {
                        setVisits(JSON.parse(localStorage.getItem('local_visits') || '[]').reverse());
                        setVisitsSource('local');
                        setLoadingVisits(false);
                    }
                };
                run();
                const interval = setInterval(run, 15000);
                return () => { cancelled = true; clearInterval(interval); };
            }, []);
            let pv = { ...(productViews || {}) };
            try {
                const localPv = JSON.parse(localStorage.getItem('local_product_views') || '{}');
                Object.keys(localPv).forEach(id => { pv[id] = Math.max(pv[id] || 0, localPv[id] || 0); });
            } catch (e) {}
            const pvRows = (products || []).map(p => ({ p, views: pv[p.id] || 0 })).sort((a, b) => b.views - a.views);
            const maxViews = Math.max(1, ...pvRows.map(r => r.views));
            const topCountries = Object.entries(stats?.topCountries || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);
            return (
                <div dir={lang === 'ar' ? 'rtl' : 'ltr'} className="min-h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-200 pb-20">
                    <header className="bg-slate-900 dark:bg-slate-950 text-white shadow-lg sticky top-0 z-50 p-4 flex justify-between items-center">
                        <div className="flex items-center gap-2"><Users className="text-blue-400" /><h1 className="text-xl font-bold">{t.visitorsLog}</h1>
                            <span className={`text-[10px] px-2 py-0.5 rounded-full ${visitsSource === 'cloud' ? 'bg-green-600/30 text-green-300' : 'bg-amber-600/30 text-amber-200'}`}>{visitsSource === 'cloud' ? (lang === 'ar' ? 'من السحابة' : 'Cloud') : (lang === 'ar' ? 'هذا الجهاز فقط' : 'This device only')}</span>
                        </div>
                        <button onClick={onBack} className="bg-slate-800 px-4 py-2 rounded-lg text-sm hover:bg-slate-700 transition text-slate-300">{t.backToDashboard}</button>
                    </header>
                    <div className="container mx-auto px-4 py-8 space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                                <h3 className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-1">{t.totalVisits}</h3>
                                <p className="text-3xl font-black text-slate-900 dark:text-white">{stats?.totalVisits || 0}</p>
                            </div>
                            <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                                <h3 className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-1">{t.dailyVisits}</h3>
                                <p className="text-3xl font-black text-slate-900 dark:text-white">{stats?.dailyVisits || 0}</p>
                            </div>
                            <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                                <h3 className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-2">{t.topCountries}</h3>
                                {topCountries.length ? topCountries.map(([c, n]) => (
                                    <div key={c} className="flex justify-between text-sm py-0.5"><span className="font-bold">{countryMap[c] || c}</span><span className="font-black text-blue-600 dark:text-blue-400" dir="ltr">{n}</span></div>
                                )) : <p className="text-slate-400 text-sm">—</p>}
                            </div>
                        </div>
                        <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                            <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-slate-900 dark:text-white"><BarChart size={20}/> {t.productViews}</h2>
                            {pvRows.length === 0 ? <p className="text-slate-400 text-center py-4">{t.noVisitors}</p> : (
                                <div className="space-y-2">
                                    {pvRows.map(({ p, views }) => (
                                        <div key={p.id} className="flex items-center gap-3">
                                            <span className="text-sm font-bold text-slate-700 dark:text-slate-300 w-36 md:w-64 truncate">{p.name}</span>
                                            <div className="flex-grow h-4 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                                <div className="h-full bg-gradient-to-l from-blue-500 to-blue-600 rounded-full transition-all" style={{ width: (views / maxViews * 100) + '%' }}></div>
                                            </div>
                                            <span className="text-sm font-black text-blue-600 dark:text-blue-400 w-10 text-left" dir="ltr">{views}</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                            <div className="p-4 border-b border-slate-100 dark:border-slate-800 font-bold text-slate-700 dark:text-slate-300">{t.visitorsLog} ({visits.length})</div>
                            {loadingVisits ? (
                                <div className="p-8 text-center"><Loader className="w-8 h-8 text-blue-600 animate-spin mx-auto" /></div>
                            ) : visits.length === 0 ? (
                                <p className="p-8 text-center text-slate-400">{t.noVisitors}</p>
                            ) : (
                                <div className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {visits.slice(0, 300).map((v, i) => (
                                        <div key={i} className="p-4 flex flex-col md:flex-row md:items-center gap-1 md:gap-6 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">

           const saveToGitHub = async (updatedProducts) => {
    const config = JSON.parse(localStorage.getItem(STORAGE_KEYS.GITHUB_CONFIG) || '{}');
    if (!config.token || !config.owner || !config.repo || !config.path) {

    try {
        // 1. جلب بيانات الملف للحصول على الـ SHA ورابط التحميل
        const getRes = await fetch(url, {
            method: 'GET',
            headers: { 'Authorization': `token ${config.token}` }
        });

        if (!getRes.ok) throw new Error("فشل قراءة الملف من GitHub.");

        const fileData = await getRes.json();
        const currentSha = fileData.sha;

        // 2. قراءة محتوى الملف كنص خام (Raw Text) لتجنب مشاكل التشفير وحجم الصور
        const rawRes = await fetch(fileData.download_url, { cache: 'no-store' });
        const currentContent = await rawRes.text();

        // 3. تحديد العلامات المرجعية
        const startMarker = "/* PRODUCTS_START */";
        const endMarker = "/* PRODUCTS_END */";

        const startIndex = currentContent.indexOf(startMarker) + startMarker.length;
        const endIndex = currentContent.indexOf(endMarker);

        if (startIndex === -1 || endIndex === -1) {
            throw new Error("لا توجد علامات تحديد في الكود المجلوب");
        }

        // 4. استبدال مصفوفة المنتجات
        const newProductsBlock = `\n        const DEFAULT_PRODUCTS = ${JSON.stringify(updatedProducts, null, 4)};\n        `;
        const newContent = currentContent.slice(0, startIndex) + newProductsBlock + currentContent.slice(endIndex);

        // 5. رفع الكود المحدث مع الـ sha
        const putRes = await fetch(url, {
            method: 'PUT',
            headers: { 
                'Authorization': `token ${config.token}`, 
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify({
                message: "Update products from Dashboard",
                content: btoa(unescape(encodeURIComponent(newContent))),
                sha: currentSha
            })
        });

        if (!putRes.ok) throw new Error(t.githubError);
        showToast(t.githubSuccess);
        
    } catch (err) {
        console.error("GitHub Sync Error:", err);
        showToast(t.githubError, "error");
    }
};


            const saveWhatsappToGitHub = async (updatedWhatsapp) => {
                const config = JSON.parse(localStorage.getItem(STORAGE_KEYS.GITHUB_CONFIG) || '{}');

                if (!config.token || !config.owner || !config.repo || !config.path) {
                    showToast('يرجى ضبط إعدادات GitHub أولاً', 'error');
                    return { ok: false, reason: 'missing-config' };
                }

                try {
                    showToast(t.githubSyncing);

                    const baseUrl = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`;
                    const getUrl = `${baseUrl}?t=${Date.now()}`;
                    const getRes = await fetch(getUrl, {
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Accept': 'application/vnd.github+json',
                            'Cache-Control': 'no-cache'
                        }
                    });

                    if (!getRes.ok) {
                        throw new Error(`GitHub GET failed: ${getRes.status}`);
                    }

                    const fileData = await getRes.json();
                    const normalizedContent = (fileData.content || '').replace(/\n/g, '');
                    let currentContent = decodeURIComponent(escape(atob(normalizedContent)));
                    const whatsappRegex = /const\s+DEFAULT_WHATSAPP_NUMBER\s*=\s*['"`][^'"`]*['"`]\s*;/;

                    if (!whatsappRegex.test(currentContent)) {
                        throw new Error('لم يتم العثور على DEFAULT_WHATSAPP_NUMBER داخل الملف');
                    }

                    currentContent = currentContent.replace(whatsappRegex, `const DEFAULT_WHATSAPP_NUMBER = '${String(updatedWhatsapp).trim()}';`);

                    const putRes = await fetch(baseUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github+json'
                        },
                        body: JSON.stringify({
                            message: 'Dashboard sync: WhatsApp updated',
                            content: btoa(unescape(encodeURIComponent(currentContent))),
                            sha: fileData.sha
                        })
                    });

                    if (!putRes.ok) {
                        const errText = await putRes.text();
                        throw new Error(`GitHub PUT failed: ${putRes.status} ${errText}`);
                    }

                    showToast(t.githubSuccess);
                    return { ok: true };
                } catch (err) {
                    console.error('GitHub WhatsApp Sync Error:', err);
                    showToast(err.message || t.githubError, 'error');
                    return { ok: false, reason: err.message };
                }

            const handleSlideClick = (slide) => {
                if (slide.productId) {

                document.getElementById('products')?.scrollIntoView({ behavior: 'smooth' });
            };

            const handleDropProduct = async (draggedId, targetId) => {
                const fromIdx = products.findIndex(p => p.id === draggedId);
                const toIdx = products.findIndex(p => p.id === targetId);
                if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
                const updated = [...products];
                const [moved] = updated.splice(fromIdx, 1);
                updated.splice(toIdx, 0, moved);
                setProducts(updated);
                try {
                    if (!isOfflineMode && db) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), { productsOrder: updated.map(p => p.id) }, { merge: true });
                    await saveToGitHub(updated);
                    showToast(t.saveData);
                } catch (e) { showToast(getErrorMessage(e, lang), 'error'); }
            };

            const handleTouchStartItem = (id) => { setTouchDragId(id); setTouchOverId(null); };

            useEffect(() => {
                if (!touchDragId) return;
                const onTouchMove = (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const el = document.elementFromPoint(touch.clientX, touch.clientY);
                    const card = el && el.closest('[data-product-id]');
                    const overId = card ? card.getAttribute('data-product-id') : null;
                    setTouchOverId(overId && overId !== touchDragId ? overId : null);
                };
                const onTouchEnd = () => {
                    if (touchOverId) handleDropProduct(touchDragId, touchOverId);
                    setTouchDragId(null);
                    setTouchOverId(null);
                };
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd);
                document.addEventListener('touchcancel', onTouchEnd);
                return () => {
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                    document.removeEventListener('touchcancel', onTouchEnd);
                };
            }, [touchDragId, touchOverId, products]);

            const handleToggleUnavailable = async (product) => { const updated = { ...product, unavailable: !product.unavailable }; const newProductsList = products.map(p => p.id === product.id ? updated : p); try { if(!isOfflineMode) { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', product.id), { unavailable: updated.unavailable }, { merge: true }); } setProducts(newProductsList); const syncResult = await saveToGitHub(newProductsList); showToast(updated.unavailable ? t.markUnavailable : t.markAvailable); } catch(e){ showToast(getErrorMessage(e, lang), 'error'); } };
            const handleDeleteProduct = (product) => { setConfirmMessage(t.delete + '?'); setConfirmAction(() => async () => { try { let newProductsList = products.filter(p => p.id !== product.id); if(!isOfflineMode) { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', product.id)); } else { setProducts(newProductsList); } const syncResult = await saveToGitHub(newProductsList); if (syncResult?.ok) showToast(t.delete); } catch(e){ showToast(getErrorMessage(e, lang), 'error'); } setShowConfirmModal(false); }); setShowConfirmModal(true); };
            const handleImageUpload = (e) => { const file = e.target.files[0]; if(file) { if (!file.type.startsWith('image/')) { showToast(t.imageTypeWarning, 'error'); return; } if(file.size > 800 * 1024) { showToast(t.imageSizeWarning, 'error'); return; } const reader = new FileReader(); reader.onloadend = () => setFormData({...formData, imageUrl: reader.result}); reader.readAsDataURL(file); } };
            const handleEditClick = (p) => { setEditingProduct(p); setFormData({name:p.name, category:p.category, duration:p.duration, price:p.price, originalPrice:p.originalPrice||'', usdPrice:p.usdPrice||'', description:p.description, imageUrl:p.imageUrl||'', type:p.type||'bundle', features:(p.features||[]).join('\n'), features_en:(p.features_en||[]).join('\n')}); setIsEditing(true); };
            const handleAddNewClick = () => { setEditingProduct(null); setFormData({name:'', category:'', duration:'', price:'', originalPrice:'', usdPrice:'', description:'', imageUrl:'', type:'bundle'}); setIsEditing(true); };

            const handleLogin = async (e) => { 
                e.preventDefault(); 
                const input = loginCode.trim();
                let isValid = false;
                try {
                    if (window.crypto && window.crypto.subtle) {
                        const hash = await hashString(input);
                        if (hash === ADMIN_HASH) isValid = true;
                    }
                } catch (err) { console.warn("Crypto check failed:", err); }
                if (!isValid) { try { if (btoa(input) === ADMIN_B64) isValid = true; } catch (err) {} }

                if (isValid) { setIsAdmin(true); setShowLoginModal(false); setLoginCode(''); setLoginError(''); showToast(t.loginTitle); } else { setLoginError(t.loginError); }
            };

            const forceOffline = () => {
                console.warn("Forcing Offline Mode");
                setIsOfflineMode(true);
                setUser({ uid: "offline-user", isAnonymous: true });
                const savedProducts = localStorage.getItem(STORAGE_KEYS.PRODUCTS);
                if (savedProducts) {
                    setProducts(JSON.parse(savedProducts));
                } else {
                    setProducts(DEFAULT_PRODUCTS);
                }
                setLoading(false);
            };

            useEffect(() => {
                const safetyTimer = setTimeout(() => {
                    if (loading) {
                        console.warn("Init Timed out");
                        forceOffline();
                    }
                }, 7000);

                if (isFirebaseConfigured) {
                    const initAuth = async () => {
                        try { 
                            await signInAnonymously(auth); 
                        } catch (error) { 
                            if (error.code === 'auth/admin-restricted-operation' || error.code === 'auth/operation-not-allowed') {
                                console.warn("Anonymous Sign-in restricted. Offline mode activated.");
                                forceOffline();
                            } else {
                                console.error("Auth Error", error);
                                forceOffline();
                            }
                        }
                    };
                    initAuth();
                    const unsubscribe = onAuthStateChanged(auth, (currentUser) => { 
                        if (currentUser) setUser(currentUser); 
                    });
                    return () => {
                        unsubscribe();
                        clearTimeout(safetyTimer);
                    };
                } else { 
                    forceOffline();
                    clearTimeout(safetyTimer);
                }
            }, []);

            useEffect(() => {
                if (isFirebaseConfigured && !isOfflineMode) {
                    if (!user || !db) return;
                    const productsRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
                    const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
                    let savedOrder = [];
                    const applyOrder = (prods) => { if (savedOrder.length) { const map = new Map(prods.map(p => [p.id, p])); const ordered = savedOrder.map(id => map.get(id)).filter(Boolean); const rest = prods.filter(p => !savedOrder.includes(p.id)); return [...ordered, ...rest]; } return prods; };

                    let resolvedInitial = false;
                    // Reliable one-shot REST fetch FIRST: guarantees the app loads with real
                    // server data even when the SDK's onSnapshot WebChannel is silently blocked
                    // by the network (carrier proxy / privacy extension / restrictive browser).
                    // Previously, a blocked onSnapshot here called forceOffline(), which then
                    // wrongly kept the ENTIRE app (visit recording + admin stats) in permanent
                    // localStorage-only mode - this was the real cause of "only my own visits".
                    (async () => {
                        try {
                            const [prodDocs, settingsDoc] = await Promise.all([
                                restListCollection(['artifacts', appId, 'public', 'data', 'products']),
                                restGetDoc(['artifacts', appId, 'public', 'data', 'settings', 'config'])

                            if (settingsDoc && Array.isArray(settingsDoc.productsOrder)) savedOrder = settingsDoc.productsOrder;

                            if (settingsDoc && Array.isArray(settingsDoc.slides) && settingsDoc.slides.length) setSlides(settingsDoc.slides);
                            if (prodDocs.length) setProducts(applyOrder(prodDocs));
                            resolvedInitial = true;
                            setLoading(false);
                        } catch (e) { console.warn('REST initial products/settings fetch failed', e); }
                    })();

                    const unsubProducts = onSnapshot(productsRef, (snapshot) => {
                        const prods = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setProducts(applyOrder(prods)); setLoading(false);
                    }, (error) => {
                        // Do NOT forceOffline() here: REST already loaded (or will load) real
                        // data above. onSnapshot is a "nice-to-have" for live updates only.
                        console.warn("onSnapshot(products) blocked - relying on REST fetch instead", error);
                        if (!resolvedInitial) { setProducts(JSON.parse(localStorage.getItem(STORAGE_KEYS.PRODUCTS)) || DEFAULT_PRODUCTS); setLoading(false); }
                    });
                    const unsubSettings = onSnapshot(settingsRef, (docSnap) => { if (docSnap.exists() && Array.isArray(docSnap.data().productsOrder)) savedOrder = docSnap.data().productsOrder; if (docSnap.exists() && docSnap.data().whatsapp) setWhatsappNumber(docSnap.data().whatsapp); else setWhatsappNumber(DEFAULT_WHATSAPP_NUMBER); if (docSnap.exists() && Array.isArray(docSnap.data().slides) && docSnap.data().slides.length) setSlides(docSnap.data().slides); }, (error) => { console.warn('onSnapshot(settings) blocked', error); });
                    return () => { unsubProducts(); unsubSettings(); };
                } else {
                    setProducts(JSON.parse(localStorage.getItem(STORAGE_KEYS.PRODUCTS)) || DEFAULT_PRODUCTS);
                    if (localStorage.getItem(STORAGE_KEYS.WHATSAPP)) setWhatsappNumber(localStorage.getItem(STORAGE_KEYS.WHATSAPP)); else setWhatsappNumber(DEFAULT_WHATSAPP_NUMBER);
                    setSlides(JSON.parse(localStorage.getItem(STORAGE_KEYS.SLIDES)) || DEFAULT_SLIDES);
                    setLoading(false);
                }
            }, [user, isOfflineMode]);

                                    <div className="flex items-center justify-between mb-4">

                                        <div className="bg-purple-100 dark:bg-purple-900/30 p-2 rounded-lg text-purple-600"><BarChart size={20} /></div>
                                    </div>
                                    <p className="text-3xl font-black text-slate-900 dark:text-white">{stats.dailyVisits}</p>
                                </div>
                                
                                <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-slate-500 dark:text-slate-400 text-sm font-bold">{t.topCountries}</h3>
                                        <div className="bg-green-100 dark:bg-green-900/30 p-2 rounded-lg text-green-600"><MapPin size={20} /></div>
                                    </div>
                                    <div className="space-y-3 max-h-40 overflow-y-auto pr-2 custom-scrollbar">
                                        {Object.keys(stats.topCountries).length > 0 ? (
                                            Object.entries(stats.topCountries)
                                                .sort(([,a], [,b]) => b - a)
                                                .map(([code, count]) => (
                                                    <div key={code} className="flex justify-between items-center text-sm border-b border-slate-50 dark:border-slate-800 pb-2 last:border-0">
                                                        <span className="font-bold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                                                            {countryMap[code] || code}

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), { whatsapp: cleanedWhatsapp }, { merge: true });
                                                    }
                                                    const syncResult = await saveWhatsappToGitHub(cleanedWhatsapp);

                                        <input type="text" value={githubConfig.path} onChange={e => setGithubConfig({...githubConfig, path: e.target.value})} className="w-full p-2 border rounded-lg bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-white" placeholder={t.githubPath} />

                            </section>
                            <section className="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                                <div className="flex justify-between mb-6"><h2 className="text-lg font-bold text-slate-900 dark:text-white">{t.manageProducts}</h2><button onClick={handleAddNewClick} className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">{t.addNew}</button></div>
                                {products.length === 0 ? <button onClick={handleSeedData} className="mx-auto bg-blue-100 text-blue-700 px-6 py-3 rounded-lg hover:bg-blue-200 transition">{t.restoreData}</button> : <div className="space-y-3">{products.map(p => <AdminProductItem key={p.id} product={p} onEdit={handleEditClick} onDelete={handleDeleteProduct} onToggleUnavailable={handleToggleUnavailable} onDropItem={handleDropProduct} onTouchStartItem={handleTouchStartItem} touchOver={touchOverId === p.id} dragging={touchDragId === p.id} lang={lang}/>)}</div>}
                            </section>
                        </div>
                        {isEditing && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                                <div className="bg-white dark:bg-slate-800 w-full max-w-lg rounded-2xl shadow-2xl overflow-y-auto max-h-[90vh]">
                                    <div className="p-6 border-b border-slate-100 dark:border-slate-700 flex justify-between sticky top-0 bg-white dark:bg-slate-800 z-10"><h3 className="text-lg font-bold text-slate-900 dark:text-white">{editingProduct ? t.edit : t.addNew}</h3><button onClick={() => setIsEditing(false)} className="text-slate-500 hover:text-red-500"><X size={24}/></button></div>
                                    <form onSubmit={handleProductSubmit} className="p-6 space-y-4">
                                        <input required placeholder={t.productName} value={formData.name} onChange={e=>setFormData({...formData, name:e.target.value})} className="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                        <input required placeholder={t.category} value={formData.category} onChange={e=>setFormData({...formData, category:e.target.value})} className="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                        
                                        <div>
                                            <label className="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">{t.type}</label>
                                            <select value={formData.type} onChange={e=>setFormData({...formData, type:e.target.value})} className="w-full p-3 border dark:border-slate-600 rounded-xl bg-white dark:bg-slate-700 dark:text-white">
                                                <option value="bundle">{t.bundle}</option>
                                                <option value="single">{t.single}</option>
                                            </select>
                                        </div>

                                        <input placeholder={t.duration} value={formData.duration} onChange={e=>setFormData({...formData, duration:e.target.value})} className="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                        
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">{t.price} ({t.currency})</label>
                                                <input placeholder="199" value={formData.price} onChange={e=>setFormData({...formData, price:e.target.value})} className="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">{t.originalPrice}</label>
                                                <input placeholder="450" value={formData.originalPrice} onChange={e=>setFormData({...formData, originalPrice:e.target.value})} className="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                            </div>
                                        </div>

                                        <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-100 dark:border-blue-800">
                                            <label className="block text-sm font-bold text-blue-800 dark:text-blue-300 mb-2 flex items-center gap-2">
                                                <Globe size={16} />
                                                {t.internationalPrice} (USD)
                                            </label>
                                            <div className="flex gap-4 items-center">
                                                <input 
                                                    type="number" 
                                                    step="0.01"
                                                    placeholder="e.g. 10" 
                                                    value={formData.usdPrice} 
                                                    onChange={e=>setFormData({...formData, usdPrice:e.target.value})} 
                                                    className="w-full p-2 border dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 dark:text-white" 
                                                />
                                                <div className="text-xs text-slate-500 dark:text-slate-400 min-w-[100px]">
                                                    <p>≈ {((parseFloat(formData.usdPrice)||0) * 3.75).toFixed(0)} {t.sar}</p>
                                                    <p>≈ {((parseFloat(formData.usdPrice)||0) * 3.67).toFixed(0)} {t.aed}</p>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-xl border border-slate-200 dark:border-slate-600">
                                            <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 flex items-center gap-2">
                                                <ImageIcon size={16} className="text-blue-600 dark:text-blue-400" />
                                                {t.imageUpload}
                                            </label>
                                            <div className="flex items-center gap-4 mb-4">
                                                <div className="w-20 h-20 bg-white dark:bg-slate-600 border border-slate-200 dark:border-slate-500 rounded-lg flex items-center justify-center overflow-hidden">
                                                    {formData.imageUrl ? (
                                                        <img src={formData.imageUrl} alt="Preview" className="w-full h-full object-contain" />
                                                    ) : (
                                                        <ImageIcon className="text-slate-300 dark:text-slate-400" />
                                                    )}
                                                </div>
                                                <div className="flex-1">
                                                    <label className="cursor-pointer bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 px-4 py-2 rounded-lg font-bold text-sm hover:bg-blue-200 dark:hover:bg-blue-800 transition inline-flex items-center gap-2">
                                                        <Upload size={16} />
                                                        {t.uploadDevice}
                                                        <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                                                    </label>
                                                    <p className="text-xs text-slate-400 mt-2">{t.imageSizeWarning}</p>
                                                </div>
                                            </div>
                                            <div className="relative">
                                                <span className="absolute top-1/2 -translate-y-1/2 right-3 text-xs font-bold text-slate-400 bg-white dark:bg-slate-600 px-1">{t.orLink}</span>
                                                <input type="url" placeholder="https://example.com/image.png" value={formData.imageUrl} onChange={(e) => setFormData({...formData, imageUrl: e.target.value})} className="w-full p-3 border dark:border-slate-500 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-left text-sm bg-white dark:bg-slate-600 dark:text-white" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 gap-3">
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 dark:text-slate-400 block mb-1">{t.featuresLabel}</label>
                                                <textarea rows="3" placeholder={t.featuresPlaceholder} value={formData.features} onChange={(e) => setFormData({...formData, features: e.target.value})} className="w-full p-3 border dark:border-slate-500 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white dark:bg-slate-600 dark:text-white" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 dark:text-slate-400 block mb-1">{t.featuresLabelEn}</label>
                                                <textarea dir="ltr" rows="3" placeholder={t.featuresPlaceholderEn} value={formData.features_en} onChange={(e) => setFormData({...formData, features_en: e.target.value})} className="w-full p-3 border dark:border-slate-500 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white dark:bg-slate-600 dark:text-white" />
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">{t.saveData}</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <main dir={lang === 'ar' ? 'rtl' : 'ltr'} className="font-sans text-slate-800 dark:text-slate-200 bg-slate-50 dark:bg-slate-950 min-h-screen flex flex-col transition-colors duration-300">
                    <Toast />
                    <nav className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-sm sticky top-0 z-40 p-4 flex justify-between items-center border-b border-slate-100 dark:border-slate-800">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={navigateHome} onDoubleClick={() => setShowLoginModal(true)}>
                            <Zap className="text-blue-600" /> <span className="text-2xl font-black text-slate-900 dark:text-white">Tech Services Store</span>
                        </div>
                        <div className="flex gap-2 items-center">
                            <div className="hidden md:flex items-center gap-2 border-l border-slate-200 dark:border-slate-700 pl-4 ml-4">
                                <a href="https://www.facebook.com/share/19RQw3jdS7/" target="_blank" rel="noopener noreferrer" className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition text-blue-600"><Facebook size={20}/></a>
                                <a href="https://www.linkedin.com/company/102599669/admin/dashboard/" target="_blank" rel="noopener noreferrer" className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition text-blue-700"><Linkedin size={20}/></a>
                                <a href="mailto:contact@tech-services.shop" className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition text-red-500"><Mail size={20}/></a>
                            </div>
                            
                            <div className="bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-lg text-lg hidden sm:block" title={`Detected Country: ${countryCode}`}>
                                {countryMap[countryCode]?.split(' ')[0] || '🌍'}
                            </div>

                            <button onClick={toggleTheme} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition text-slate-700 dark:text-slate-300" aria-label={t.toggleTheme}>
                                {isDarkMode ? <Sun size={20}/> : <Moon size={20}/>}
                            </button>
                            <button onClick={toggleLanguage} className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-lg transition font-bold text-sm" aria-label="Language">
                                <Globe size={18} />
                                <span>{lang === 'ar' ? 'EN' : 'عربي'}</span>
                            </button>
                        </div>
                    </nav>

                    {selectedProduct ? (
                        <ProductDetailsPage product={selectedProduct} onBack={handleCloseProduct} onOrder={openWhatsapp} countryCode={countryCode} onProductSelect={openProductLink} allProducts={products.length>0?products:DEFAULT_PRODUCTS} lang={lang} onShare={handleShare} />
                    ) : (
                        <>
                            <div className="pt-4">
                                <HeroCarousel slides={slides} lang={lang} onSlideClick={handleSlideClick} />
                            </div>
                            <header className="py-8 md:py-12 text-center container mx-auto px-4 animate-fade-in relative">
                                <span className="inline-block bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 px-4 py-1.5 rounded-full text-sm font-bold mb-5 border border-blue-100 dark:border-blue-800 animate-fade-in">
                                    {t.bestValue}
                                </span>
                                <h1 className="text-3xl md:text-6xl font-black mb-4 md:mb-6 text-slate-900 dark:text-white leading-snug md:leading-relaxed">
                                    {t.heroTitle1}
                                    <span className="text-blue-600 block md:inline-block mx-0 md:mx-2 mt-2 md:mt-4">{t.heroTitle2}</span>
                                </h1>
                                <p className="text-base md:text-xl text-slate-500 dark:text-slate-400 mb-3 max-w-2xl mx-auto leading-relaxed">{t.heroDesc}</p>
                                <p dir="ltr" className="text-sm md:text-base font-bold text-slate-700 dark:text-slate-300 mb-7 tracking-wide">{t.heroBrands}</p>
                                <button onClick={() => document.getElementById('products').scrollIntoView({behavior: 'smooth'})} className="bg-blue-600 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition">{t.browseOffers}</button>
                            </header>
                            <section className="container mx-auto px-4 pb-4">
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    {[
                                        { icon: <ShieldCheck size={18} />, label: t.trustOriginal },
                                        { icon: <Clock size={18} />, label: t.trustInstant },
                                        { icon: <CheckCircle size={18} />, label: t.trustWarranty },
                                        { icon: <MessageCircle size={18} />, label: t.trustSupport }
                                    ].map((item, i) => (
                                        <div key={i} className="flex items-center gap-2 bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-2xl px-3 py-3 shadow-sm">
                                            <span className="text-blue-600 dark:text-blue-400 shrink-0">{item.icon}</span>
                                            <span className="text-xs md:text-sm font-bold text-slate-700 dark:text-slate-200">{item.label}</span>
                                        </div>
                                    ))}
                                </div>
                            </section>
                            {(() => {
                                const catalog = products.length ? products : DEFAULT_PRODUCTS;
                                const top = catalog
                                    .filter(p => !p.unavailable)
                                    .map(p => ({ p, views: productViews[p.id] || 0 }))
                                    .sort((a, b) => b.views - a.views)
                                    .filter((row, idx) => row.views > 0 || idx < 3)
                                    .slice(0, 4);
                                if (!top.length) return null;
                                return (
                                    <section className="container mx-auto px-4 pt-8 pb-2">
                                        <div className="flex items-end justify-between mb-5">
                                            <div>
                                                <h2 className="text-xl md:text-2xl font-black text-slate-900 dark:text-white flex items-center gap-2"><Star className="text-amber-500" size={22} /> {t.mostViewed}</h2>
                                                <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">{t.mostViewedSub}</p>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-5">
                                            {top.map(({ p, views }) => {
                                                const content = getLocalizedContent(p, lang);
                                                const pricing = getLocalizedPrice(p, countryCode, lang);
                                                return (
                                                    <button key={p.id} onClick={() => openProductLink(p)} className="text-start bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-2xl p-3 shadow-sm hover:shadow-md transition">
                                                        <div className="h-20 md:h-24 flex items-center justify-center bg-slate-50 dark:bg-slate-800 rounded-xl mb-3 p-2">
                                                            {p.imageUrl ? <img src={p.imageUrl} alt={content.name} className="max-h-full object-contain" /> : <ImageIcon className="text-slate-300" />}
                                                        </div>
                                                        <p className="font-bold text-sm text-slate-900 dark:text-white line-clamp-2 min-h-[2.5rem]">{content.name}</p>
                                                        <div className="flex items-center justify-between mt-2 gap-2">
                                                            <span className="text-xs font-black text-blue-600">{pricing.current}</span>
                                                            <span className="text-[10px] text-slate-400 font-bold">{views} {t.viewsCount}</span>
                                                        </div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </section>
                                );
                            })()}
                            <section id="products" className="py-10 md:py-12 flex-grow container mx-auto px-4">
                                <div className="text-center mb-10">
                                    <h2 className="text-2xl md:text-3xl font-bold mb-4 text-slate-900 dark:text-white flex items-center justify-center gap-2">
                                        <Layers className="text-blue-600" />
                                        {t.allOffers}
                                    </h2>
                                    <div className="h-1 w-20 bg-blue-600 mx-auto rounded-full mb-4"></div>
                                    <p className="text-slate-500 dark:text-slate-400">{t.chooseOffer}</p>
                                </div>

                                <div className="mb-10 flex flex-col md:flex-row justify-between items-center gap-4 bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors duration-300">
                                    <div className="relative w-full md:w-1/3">
                                        <div className="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none" style={{[lang==='ar'?'right':'left']: '12px'}}>
                                            <Search className="h-5 w-5 text-slate-400 dark:text-slate-500" />
                                        </div>
                                        <input 
                                            type="text" 
                                            className={`w-full ${lang==='ar'?'pr-10':'pl-10'} p-3 rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-blue-500 outline-none transition bg-slate-50 dark:bg-slate-800 focus:bg-white dark:focus:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400`}
                                            placeholder={t.searchPlaceholder}
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                        />
                                    </div>
                                    
                                    <div className="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 no-scrollbar">
                                        {categories.map(cat => (
                                            <button 
                                                key={cat} 
                                                onClick={() => setSelectedCategory(cat)} 
                                                className={`px-4 py-2 rounded-lg border whitespace-nowrap transition ${selectedCategory === cat ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'bg-white text-slate-600 border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'}`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {filteredProducts.length === 0 ? (
                                    <div className="text-center py-20 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-200 dark:border-slate-800">
                                        <Search className="mx-auto text-slate-300 dark:text-slate-600 mb-4" size={48} />
                                        <p className="text-slate-400 dark:text-slate-500 font-bold text-lg">{t.noProducts}</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                        {filteredProducts.map(product => <ProductCard key={product.id} product={product} onViewDetails={openProductLink} countryCode={countryCode} lang={lang} />)}
                                    </div>
                                )}
                            </section>
                        </>
                    )}
                    
                    <footer className="bg-slate-900 dark:bg-slate-950 text-slate-300 py-12 mt-auto border-t border-slate-800">
                        <div className="container mx-auto px-4 text-center">
                            <div className="flex items-center justify-center gap-4 mb-6">
                                <Zap className="text-blue-500 w-6 h-6" />
                                <span className="text-xl font-bold text-white">{t.appTitle}</span>
                            </div>
                            
                            <div className="flex justify-center gap-4 mb-8">
                                <a href="https://www.facebook.com/share/19RQw3jdS7/" target="_blank" rel="noopener noreferrer" className="bg-slate-800 hover:bg-blue-600 text-white p-3 rounded-full transition"><Facebook size={20} /></a>
                                <a href="https://www.linkedin.com/company/102599669/admin/dashboard/" target="_blank" rel="noopener noreferrer" className="bg-slate-800 hover:bg-blue-700 text-white p-3 rounded-full transition"><Linkedin size={20} /></a>
                                <a href="mailto:contact@tech-services.shop" className="bg-slate-800 hover:bg-red-500 text-white p-3 rounded-full transition"><Mail size={20} /></a>
                                <button onClick={() => openWhatsapp()} className="bg-slate-800 hover:bg-green-600 text-white p-3 rounded-full transition"><MessageCircle size={20} /></button>
                            </div>

                            <p className="mb-8 max-w-md mx-auto text-sm text-slate-400">{t.footerDesc}</p>
                            <div className="border-t border-slate-800 pt-8 text-sm">
                                &copy; {t.copyright}
                            </div>
                        </div>
                    </footer>

                    {showLoginModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl shadow-2xl p-6 animate-fade-in">
                                <div className="flex justify-between mb-6 items-center">
                                    <h3 className="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2"><Lock className="text-blue-600"/> {t.loginTitle}</h3>
                                    <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-red-500"><X/></button>
                                </div>
                                <form onSubmit={handleLogin}>
                                    <label className="block text-sm text-slate-500 dark:text-slate-400 mb-2">{t.passCode}</label>
                                    <input type="password" value={loginCode} onChange={(e) => setLoginCode(e.target.value)} placeholder="******" className="w-full p-3 border dark:border-slate-600 rounded-xl mb-4 bg-slate-50 dark:bg-slate-700 dark:text-white text-center tracking-[0.5em] font-bold outline-none focus:ring-2 focus:ring-blue-500" autoFocus />
                                    {loginError && <div className="text-red-500 bg-red-50 dark:bg-red-900/20 p-3 rounded-lg text-sm mb-4 flex items-center gap-2"><AlertCircle size={16}/> {loginError}</div>}
                                    <button type="submit" className="w-full bg-slate-900 dark:bg-blue-600 text-white py-3 rounded-xl font-bold hover:opacity-90 transition">{t.enter}</button>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    <button onClick={() => openWhatsapp()} className="fixed bottom-5 left-1/2 -translate-x-1/2 md:left-auto md:translate-x-0 md:right-6 md:bottom-6 bg-green-500 hover:bg-green-600 text-white px-5 py-3 md:px-4 md:py-4 rounded-full shadow-xl z-50 transition-transform hover:scale-105 active:scale-95 flex items-center gap-2 font-bold" aria-label="WhatsApp">
                        <MessageCircle size={22} />
                        <span className="text-sm md:hidden">{t.orderWhatsapp}</span>
                    </button>
                </main>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
