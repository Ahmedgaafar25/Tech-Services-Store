                                className="hidden"
                                onChange={handleImageUpload}
                              />
                            </label>
                            <p className="text-xs text-slate-400 mt-2">
                              {t.imageSizeWarning}
                            </p>
                          </div>
                        </div>
                        <div className="relative">
                          <span className="absolute top-1/2 -translate-y-1/2 right-3 text-xs font-bold text-slate-400 bg-white dark:bg-slate-600 px-1">
                            {t.orLink}
                          </span>
                          <input
                            type="url"
                            placeholder="https://example.com/image.png"
                            value={formData.imageUrl}
                            onChange={(e) =>
                              setFormData({
                                ...formData,
                                imageUrl: e.target.value,
                              })
                            }
                            className="w-full p-3 border dark:border-slate-500 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-left text-sm bg-white dark:bg-slate-600 dark:text-white"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 gap-3">
                        <div>
                          <label className="text-xs font-bold text-slate-500 dark:text-slate-400 block mb-1">
                            {t.featuresLabel}
                          </label>
                          <textarea
                            rows="3"
                            placeholder={t.featuresPlaceholder}
                            value={formData.features}
                            onChange={(e) =>
                              setFormData({
                                ...formData,
                                features: e.target.value,
                              })
                            }
                            className="w-full p-3 border dark:border-slate-500 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white dark:bg-slate-600 dark:text-white"
                          />
                        </div>
                        <div>
                          <label className="text-xs font-bold text-slate-500 dark:text-slate-400 block mb-1">
                            {t.featuresLabelEn}
                          </label>
                          <textarea
                            dir="ltr"
                            rows="3"
                            placeholder={t.featuresPlaceholderEn}
                            value={formData.features_en}
                            onChange={(e) =>
                              setFormData({
                                ...formData,
                                features_en: e.target.value,
                              })
                            }
                            className="w-full p-3 border dark:border-slate-500 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white dark:bg-slate-600 dark:text-white"
                          />
                        </div>
                      </div>
                      <button
                        type="submit"
                        className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition"
                      >
                        {t.saveData}
                      </button>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        return (
          <main
            dir={lang === "ar" ? "rtl" : "ltr"}
            className="font-sans text-slate-800 dark:text-slate-200 bg-slate-50 dark:bg-slate-950 min-h-screen flex flex-col transition-colors duration-300"
          >
            <Toast />
            <nav className="bg-white/85 dark:bg-slate-900/85 backdrop-blur-md shadow-sm sticky top-0 z-40 py-3 px-4 sm:px-6 flex justify-between items-center border-b border-slate-100 dark:border-slate-800">
              <div
                className="flex items-center gap-2 cursor-pointer min-w-0"
                onClick={navigateHome}
                onDoubleClick={() => setShowLoginModal(true)}
              >
                <StoreLogo compact />
              </div>
              <div className="flex gap-1.5 sm:gap-2 items-center">
                <div className="hidden md:flex items-center gap-2 border-l border-slate-200 dark:border-slate-700 pl-4 ml-4">
                  <a
                    href="https://www.facebook.com/share/19RQw3jdS7/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition text-blue-600"
                  >
                    <Facebook size={20} />
                  </a>
                  <a
                    href="https://www.linkedin.com/company/102599669/admin/dashboard/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition text-blue-700"
                  >
                    <Linkedin size={20} />
                  </a>
                  <a
                    href="mailto:contact@tech-services.shop"
                    className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition text-red-500"
                  >
                    <Mail size={20} />
                  </a>
                </div>

                <div
                  className="bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-lg text-lg hidden sm:block"
                  title={`Detected Country: ${countryCode}`}
                >
                  {countryMap[countryCode]?.split(" ")[0] || "🌍"}
                </div>

                <button
                  onClick={toggleTheme}
                  className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition text-slate-700 dark:text-slate-300"
                  aria-label={t.toggleTheme}
                >
                  {isDarkMode ? <Sun size={20} /> : <Moon size={20} />}
                </button>
                <button
                  onClick={toggleLanguage}
                  className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-lg transition font-bold text-sm"
                  aria-label="Language"
                >
                  <Globe size={18} />
                  <span>{lang === "ar" ? "EN" : "عربي"}</span>
                </button>
              </div>
            </nav>

            {selectedProduct ? (
              <ProductDetailsPage
                product={selectedProduct}
                onBack={handleCloseProduct}
                onOrder={openWhatsapp}
                countryCode={countryCode}
                onProductSelect={openProductLink}
                allProducts={products.length > 0 ? products : DEFAULT_PRODUCTS}
                lang={lang}
                onShare={handleShare}
              />
            ) : (
              <>
                <div className="pt-4">
                  <HeroCarousel
                    slides={slides}
                    lang={lang}
                    onSlideClick={handleSlideClick}
                  />
                </div>
                <header className="py-8 md:py-12 text-center container mx-auto px-4 animate-fade-in relative">
                  <span className="inline-block bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 px-4 py-1.5 rounded-full text-sm font-bold mb-5 border border-blue-100 dark:border-blue-800 animate-fade-in">
                    {t.bestValue}
                  </span>
                  <h1 className="text-3xl md:text-6xl font-black mb-4 md:mb-6 text-slate-900 dark:text-white leading-snug md:leading-relaxed">
                    {t.heroTitle1}
                    <span className="text-blue-600 block md:inline-block mx-0 md:mx-2 mt-2 md:mt-4">
                      {t.heroTitle2}
                    </span>
                  </h1>
                  <p className="text-base md:text-xl text-slate-500 dark:text-slate-400 mb-3 max-w-2xl mx-auto leading-relaxed">
                    {t.heroDesc}
                  </p>
                  <p
                    dir="ltr"
                    className="text-sm md:text-base font-bold text-slate-700 dark:text-slate-300 mb-7 tracking-wide"
                  >
                    {t.heroBrands}
                  </p>
                  <button
                    onClick={() =>
                      document
                        .getElementById("products")
                        .scrollIntoView({ behavior: "smooth" })
                    }
                    className="bg-blue-600 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition"
                  >
                    {t.browseOffers}
                  </button>
                </header>
                <section className="container mx-auto px-4 pb-4">
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                    {[
                      {
                        icon: <ShieldCheck size={18} />,
                        label: t.trustOriginal,
                      },
                      { icon: <Clock size={18} />, label: t.trustInstant },
                      {
                        icon: <CheckCircle size={18} />,
                        label: t.trustWarranty,
                      },
                      {
                        icon: <MessageCircle size={18} />,
                        label: t.trustSupport,
                      },
                    ].map((item, i) => (
                      <div
                        key={i}
                        className="flex items-center gap-2 bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-2xl px-3 py-3 shadow-sm"
                      >
                        <span className="text-blue-600 dark:text-blue-400 shrink-0">
                          {item.icon}
                        </span>
                        <span className="text-xs md:text-sm font-bold text-slate-700 dark:text-slate-200">
                          {item.label}
                        </span>
                      </div>
                    ))}
                  </div>
                </section>
                {(() => {
                  const catalog = products.length ? products : DEFAULT_PRODUCTS;
                  const top = catalog
                    .filter((p) => !p.unavailable)
                    .map((p) => ({ p, views: productViews[p.id] || 0 }))
                    .sort((a, b) => b.views - a.views)
                    .filter((row, idx) => row.views > 0 || idx < 3)
                    .slice(0, 4);
                  if (!top.length) return null;
                  return (
                    <section className="container mx-auto px-4 pt-8 pb-2">
                      <div className="flex items-end justify-between mb-5">
                        <div>
                          <h2 className="text-xl md:text-2xl font-black text-slate-900 dark:text-white flex items-center gap-2">
                            <Star className="text-amber-500" size={22} />{" "}
                            {t.mostViewed}
                          </h2>
                          <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">
                            {t.mostViewedSub}
                          </p>
                        </div>
                      </div>
                      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-5">
                        {top.map(({ p, views }) => {
                          const content = getLocalizedContent(p, lang);
                          const pricing = getLocalizedPrice(
                            p,
                            countryCode,
                            lang,
                          );
                          return (
                            <button
                              key={p.id}
                              onClick={() => openProductLink(p)}
                              className="text-start bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-2xl p-3 shadow-sm hover:shadow-md transition"
                            >
                              <div className="h-20 md:h-24 flex items-center justify-center bg-slate-50 dark:bg-slate-800 rounded-xl mb-3 p-2">
                                {p.imageUrl ? (
                                  <img
                                    src={p.imageUrl}
                                    alt={content.name}
                                    className="max-h-full object-contain"
                                  />
                                ) : (
                                  <ImageIcon className="text-slate-300" />
                                )}
                              </div>
                              <p className="font-bold text-sm text-slate-900 dark:text-white line-clamp-2 min-h-[2.5rem]">
                                {content.name}
                              </p>
                              <div className="flex items-center justify-between mt-2 gap-2">
                                <span className="text-xs font-black text-blue-600">
                                  {pricing.current}
                                </span>
                                <span className="text-[10px] text-slate-400 font-bold">
                                  {views} {t.viewsCount}
                                </span>
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    </section>
                  );
                })()}
                <section
                  id="products"
                  className="py-10 md:py-12 flex-grow container mx-auto px-4 scroll-mt-20"
                >
                  <div className="text-center mb-10">
                    <h2 className="text-2xl md:text-3xl font-bold mb-4 text-slate-900 dark:text-white flex items-center justify-center gap-2">
                      <Layers className="text-blue-600" />
                      {t.allOffers}
                    </h2>
                    <div className="h-1 w-20 bg-blue-600 mx-auto rounded-full mb-4"></div>
                    <p className="text-slate-500 dark:text-slate-400">
                      {t.chooseOffer}
                    </p>
                  </div>

                  <div className="mb-10 flex flex-col md:flex-row justify-between items-center gap-4 bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors duration-300">
                    <div className="relative w-full md:w-1/3">
                      <Search
                        className={`absolute top-1/2 -translate-y-1/2 ${lang === "ar" ? "right-3" : "left-3"} h-5 w-5 text-slate-400 dark:text-slate-500 pointer-events-none`}
                      />
                      <input
                        type="text"
                        className={`w-full ${lang === "ar" ? "pr-10 pl-9" : "pl-10 pr-9"} p-3 rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-blue-500 outline-none transition bg-slate-50 dark:bg-slate-800 focus:bg-white dark:focus:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400`}
                        placeholder={t.searchPlaceholder}
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                      />
                      {searchQuery && (
                        <button
                          onClick={() => setSearchQuery("")}
                          aria-label="clear"
                          className={`absolute top-1/2 -translate-y-1/2 ${lang === "ar" ? "left-3" : "right-3"} text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition`}
                        >
                          <X size={18} />
                        </button>
                      )}
                    </div>

                    <div className="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 no-scrollbar">
                      {visibleCategoryGroups.map((group) => (
                        <button
                          key={group.id}
                          onClick={() => setSelectedCategory(group.id)}
                          className={`px-4 py-2 rounded-lg border whitespace-nowrap transition font-bold text-sm ${selectedCategory === group.id ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900" : "bg-white text-slate-600 border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700"}`}
                        >
                          {t[group.labelKey] || group.id}
                        </button>
                      ))}
                      <select
                        value={sortBy}
                        onChange={(e) => setSortBy(e.target.value)}
                        className="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-sm font-bold whitespace-nowrap"
                      >
                        <option value="default">
                          {t.sortBy}: {t.sortDefault}
                        </option>
                        <option value="views">{t.sortViews}</option>
                        <option value="price_low">{t.sortPriceLow}</option>
                        <option value="price_high">{t.sortPriceHigh}</option>
                      </select>
                    </div>
                  </div>

                  {filteredProducts.length === 0 ? (
                    <div className="text-center py-14 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-200 dark:border-slate-800">
                      <Search
                        className="mx-auto text-slate-300 dark:text-slate-600 mb-4"
                        size={44}
                      />
                      <p className="text-slate-500 dark:text-slate-400 font-bold text-lg mb-1">
                        {t.noProducts}
                      </p>
                      <p className="text-slate-400 dark:text-slate-500 text-sm mb-5">
                        {lang === "ar"
                          ? "جرّب تعديل البحث أو تصفّح كل العروض."
                          : "Try adjusting your search or browse all offers."}
                      </p>
                      <button
                        onClick={() => {
                          setSearchQuery("");
                          setSelectedCategory("All");
                        }}
                        className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-sm transition"
                      >
                        {lang === "ar"
                          ? "تصفّح كل العروض"
                          : "Browse all offers"}
                      </button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                      {filteredProducts.map((product) => (
                        <ProductCard
                          key={product.id}
                          product={product}
                          onViewDetails={openProductLink}
                          countryCode={countryCode}
                          lang={lang}
                        />
                      ))}
                    </div>
                  )}
                </section>
              </>
            )}

            <footer className="bg-slate-900 dark:bg-slate-950 text-slate-300 py-12 mt-auto border-t border-slate-800">
              <div className="container mx-auto px-4 text-center">
                <div className="flex items-center justify-center gap-4 mb-6">
                  <StoreLogo light />
                </div>

                <div className="flex justify-center gap-4 mb-8">
                  <a
                    href="https://www.facebook.com/share/19RQw3jdS7/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="bg-slate-800 hover:bg-blue-600 text-white p-3 rounded-full transition"
                  >
                    <Facebook size={20} />
                  </a>
                  <a
                    href="https://www.linkedin.com/company/102599669/admin/dashboard/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="bg-slate-800 hover:bg-blue-700 text-white p-3 rounded-full transition"
                  >
                    <Linkedin size={20} />
                  </a>
                  <a
                    href="mailto:contact@tech-services.shop"
                    className="bg-slate-800 hover:bg-red-500 text-white p-3 rounded-full transition"
                  >
                    <Mail size={20} />
                  </a>
                  <button
                    onClick={() => openWhatsapp()}
                    className="bg-slate-800 hover:bg-green-600 text-white p-3 rounded-full transition"
                  >
                    <MessageCircle size={20} />
                  </button>
                </div>

                <p className="mb-8 max-w-md mx-auto text-sm text-slate-400">
                  {t.footerDesc}
                </p>
                <div className="border-t border-slate-800 pt-8 text-sm">
                  &copy; {t.copyright}
                </div>
              </div>
            </footer>

            {showLoginModal && (
              <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl shadow-2xl p-6 animate-fade-in">
                  <div className="flex justify-between mb-6 items-center">
                    <h3 className="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                      <Lock className="text-blue-600" /> {t.loginTitle}
                    </h3>
                    <button
                      onClick={() => setShowLoginModal(false)}
                      className="text-slate-400 hover:text-red-500"
                    >
                      <X />
                    </button>
                  </div>
                  <form onSubmit={handleLogin}>
                    <label className="block text-sm text-slate-500 dark:text-slate-400 mb-2">
                      {t.passCode}
                    </label>
                    <input
                      type="password"
                      value={loginCode}
                      onChange={(e) => setLoginCode(e.target.value)}
                      placeholder="******"
                      className="w-full p-3 border dark:border-slate-600 rounded-xl mb-4 bg-slate-50 dark:bg-slate-700 dark:text-white text-center tracking-[0.5em] font-bold outline-none focus:ring-2 focus:ring-blue-500"
                      autoFocus
                    />
                    {loginError && (
                      <div className="text-red-500 bg-red-50 dark:bg-red-900/20 p-3 rounded-lg text-sm mb-4 flex items-center gap-2">
                        <AlertCircle size={16} /> {loginError}
                      </div>
                    )}
                    <button
                      type="submit"
                      className="w-full bg-slate-900 dark:bg-blue-600 text-white py-3 rounded-xl font-bold hover:opacity-90 transition"
                    >
                      {t.enter}
                    </button>
                  </form>
                </div>
              </div>
            )}

          </main>
        );
      }

      const root = createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
