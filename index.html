        const useCountry = () => {
            const [countryCode, setCountryCode] = useState(() => {
                return localStorage.getItem(STORAGE_KEYS.USER_COUNTRY) || 'EG';
            }); 
            
            useEffect(() => {
                const detectCountry = async () => {
                    try {
                        const res = await fetch('https://get.geojs.io/v1/ip/country.json');
                        if (res.ok) {
                            const data = await res.json();
                            if (data.country) {
                                setCountryCode(data.country);
                                localStorage.setItem(STORAGE_KEYS.USER_COUNTRY, data.country);
                                return;
                            }
                        }
                    } catch (e) { console.warn("GeoJS failed", e); }
                    
                    try {
                        const res = await fetch('https://ipapi.co/json/');
                        if (res.ok) {
                            const data = await res.json();
                            if (data.country_code) {
                                setCountryCode(data.country_code);
                                localStorage.setItem(STORAGE_KEYS.USER_COUNTRY, data.country_code);
                                return;
                            }
                        }
                    } catch (e) { console.warn("ipapi failed", e); }
                };

                detectCountry();
            }, []);

            return countryCode;
        };

            if (isIncluded) return { current: translations[lang].priceInBundle, original: null };
            if (isNaN(parseFloat(product.price))) return { current: product.price, original: null };

            const baseUsd = parseFloat(product.usdPrice) || (parseFloat(product.price) / 35); 
            let originalUsd = null;
            if (product.originalPrice) {
                 const discountRatio = parseFloat(product.originalPrice) / parseFloat(product.price);
                 originalUsd = baseUsd * discountRatio;
            }
            const roundTo5 = (num) => Math.ceil(num / 5) * 5;

            if (countryCode === 'EG') {
                return { current: `${product.price} ${translations[lang].currency}`, original: product.originalPrice ? `${product.originalPrice} ${translations[lang].currency}` : null };
            } else if (countryCode === 'SA') {

            }
        };

            if (!window.crypto || !window.crypto.subtle) return "fallback";
            const msgBuffer = new TextEncoder().encode(message);

            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            const config = JSON.parse(localStorage.getItem(STORAGE_KEYS.GITHUB_CONFIG) || '{}');
            if (!config.token || !config.owner || !config.repo || !config.path) {
                console.warn("GitHub config missing");
                return;
            }

            try {
                const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`;
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${config.token}` } });
                if (!getRes.ok) throw new Error("فشل جلب ملف الكود");
                
                const fileData = await getRes.json();
                const currentContent = decodeURIComponent(escape(atob(fileData.content)));
                
                const startMarker = '/* PRODUCTS_START */';
                const endMarker = '/* PRODUCTS_END */';
                const startIndex = currentContent.indexOf(startMarker) + startMarker.length;
                const endIndex = currentContent.indexOf(endMarker);
                
                if (startIndex === -1 || endIndex === -1) throw new Error("لا توجد علامات تحديد في الكود");
                
                const newProductsBlock = `\n        const DEFAULT_PRODUCTS = ${JSON.stringify(updatedProducts, null, 4)};\n    `;
                const newContent = currentContent.slice(0, startIndex) + newProductsBlock + currentContent.slice(endIndex);
                
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Update products from Dashboard",

                                            <img src={product.imageUrl} alt={content.name} className="w-full h-full object-contain" onError={() => setImageError(true)} loading="lazy" />
                                        ) : (
                                            <ImageIcon className="w-20 h-20 text-slate-300 dark:text-slate-500" />
                                        )}
                                    </div>
                                </div>
                                <div className="w-full md:w-2/3 p-6 md:p-10 flex flex-col justify-center">
                                    <div className="flex flex-wrap items-center gap-3 mb-3">
                                        <span className="text-blue-600 dark:text-blue-400 text-xs font-bold bg-blue-50 dark:bg-blue-900/30 px-3 py-1 rounded-full border border-blue-100 dark:border-blue-800">
                                            {product.category}
                                        </span>
                                        {product.type !== 'single' && (
                                            <span className="text-green-600 dark:text-green-400 text-xs font-bold bg-green-50 dark:bg-green-900/30 px-3 py-1 rounded-full border border-green-100 dark:border-green-800 flex items-center gap-1">
                                                <ShieldCheck size={12} /> {t.guarantee} {content.duration}
                                            </span>
                                        )}
                                    </div>
                                    <h1 className="text-3xl font-black text-slate-900 dark:text-white mb-4">{content.name}</h1>
                                    <div className="flex items-center gap-3">
                                        <span className={`text-3xl font-bold ${product.price === "ضمن الباقة" ? 'text-blue-600 dark:text-blue-400' : 'text-slate-900 dark:text-white'}`}>
                                            {pricing.current}
                                        </span>
                                        {pricing.original && (
                                            <span className="text-lg text-gray-400 dark:text-gray-500 line-through decoration-red-500">
                                                {pricing.original}
                                            </span>
                                        )}
                                    </div>
                                    <span className="text-sm text-slate-500 dark:text-slate-400 mt-1">/ {content.duration}</span>
                                </div>
                            </div>

                            <div className="p-6 md:p-10 space-y-10">
                                <section>
                                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                                        <Star className="w-5 h-5 text-yellow-500 fill-current" />
                                        {t.descriptionTitle}
                                    </h3>
                                    <p className="text-slate-600 dark:text-slate-300 leading-loose text-lg">
                                        {content.description}
                                    </p>
                                </section>

                                {product.type !== 'single' && (
                                    <section>
                                        <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                                            <Zap className="w-5 h-5 text-blue-600 dark:text-blue-400" />
                                            {t.featuresTitle}
                                        </h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            {features.map((feature, idx) => (
                                                <div key={idx} className="flex items-start gap-3 p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700">
                                                    <CheckCircle className="w-5 h-5 text-green-500 dark:text-green-400 mt-0.5 flex-shrink-0" />
                                                    <span className="text-slate-700 dark:text-slate-300 font-medium text-sm">{feature}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </section>
                                )}

                                {product.compatibility && (
                                    <section className="bg-blue-50/50 dark:bg-blue-900/20 rounded-2xl p-6 border border-blue-100 dark:border-blue-900/50">
                                        <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                                            <Monitor className="w-5 h-5 text-blue-600 dark:text-blue-400" />
                                            {t.compatibleWith}
                                        </h3>
                                        <div className="flex flex-wrap gap-3">
                                            {compatibility.map((os, idx) => (
                                                <span key={idx} className="bg-white dark:bg-slate-800 px-4 py-2 rounded-lg text-sm font-bold text-slate-700 dark:text-slate-300 shadow-sm border border-slate-100 dark:border-slate-700 flex items-center gap-2">
                                                    {os.toLowerCase().includes('windows') || os.toLowerCase().includes('mac') ? <Laptop size={16} /> : <Smartphone size={16} />}
                                                    {os}
                                                </span>
                                            ))}
                                        </div>
                                    </section>
                                )}

                                {isLinkedIn && relatedProducts.length > 0 && (
                                    <section className="mt-8 pt-8 border-t border-slate-200 dark:border-slate-700">
                                        <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                                            <ArrowLeftRight className="w-5 h-5 text-purple-600 dark:text-purple-400" />
                                            {t.relatedTitle}
                                        </h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            {relatedProducts.map(relProd => {
                                                 const relPricing = getLocalizedPrice(relProd, countryCode, lang);
                                                 const relContent = getLocalizedContent(relProd, lang);
                                                 return (
                                                    <div key={relProd.id} onClick={() => onProductSelect(relProd)} className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-4 cursor-pointer hover:border-blue-500 dark:hover:border-blue-400 hover:shadow-md transition flex items-center gap-4">
                                                        <div className="w-12 h-12 flex-shrink-0 bg-slate-50 dark:bg-slate-700 rounded-lg flex items-center justify-center">
                                                            <img src={relProd.imageUrl} alt={relContent.name} className="w-8 h-8 object-contain" />
                                                        </div>
                                                        <div>
                                                            <h4 className="font-bold text-sm text-slate-900 dark:text-white">{relContent.name}</h4>
                                                            <p className="text-xs text-blue-600 dark:text-blue-400 font-bold mt-1">{relPricing.current}</p>
                                                        </div>
                                                        <div className="mr-auto">
                                                            <ArrowRight className="w-4 h-4 text-slate-400 dark:text-slate-500" />
                                                        </div>
                                                    </div>
                                                 );
                                            })}
                                        </div>
                                    </section>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 p-4 shadow-lg z-40">
                        <div className="container mx-auto max-w-4xl flex items-center justify-between gap-4">
                            <div className="hidden md:block">
                                <p className="text-sm text-slate-500 dark:text-slate-400">{t.offerPrice}</p>
                                <div className="flex items-baseline gap-2">
                                     <p className={`text-xl font-bold ${product.price === "ضمن الباقة" ? 'text-blue-600 dark:text-blue-400' : 'text-slate-900 dark:text-white'}`}>
                                        {pricing.current}
                                     </p>
                                     {pricing.original && <p className="text-sm text-gray-400 dark:text-gray-500 line-through">{pricing.original}</p>}
                                </div>
                            </div>
                            <button onClick={handleOrderClick} className="flex-1 bg-slate-900 dark:bg-slate-100 hover:bg-blue-600 dark:hover:bg-blue-600 text-white dark:text-slate-900 dark:hover:text-white text-lg font-bold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                                <span>{t.orderNow}</span>
                                <MessageCircle className="w-5 h-5" />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminProductItem = ({ product, onDelete, onEdit, lang }) => (
            <div className="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col md:flex-row items-center gap-4">
                <div className="w-16 h-16 bg-white dark:bg-slate-700 rounded-lg border border-slate-100 dark:border-slate-600 flex-shrink-0 overflow-hidden flex items-center justify-center p-2">
                    {product.imageUrl ? <img src={product.imageUrl} alt="" className="w-full h-full object-contain" /> : <ImageIcon className="w-full h-full text-slate-300 dark:text-slate-500" />}
                </div>
                <div className="flex-grow text-center md:text-right">
                    <h4 className="font-bold text-slate-900 dark:text-white">{product.name}</h4>
                    <div className="flex items-center justify-center md:justify-end gap-2 mt-1">
                        <span className={`text-xs px-2 py-0.5 rounded-full ${product.type === 'single' ? 'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300' : 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300'}`}>
                            {product.type === 'single' ? translations[lang].single : translations[lang].bundle}
                        </span>
                        <p className="text-sm text-slate-500 dark:text-slate-400">{product.category}</p>
                    </div>
                    <div className="text-sm font-bold text-green-600 dark:text-green-400 mt-1">{product.price}</div>
                </div>
                <div className="flex gap-2">
                    <button aria-label={translations[lang].edit} onClick={() => onEdit(product)} className="p-2 text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition"><Edit className="w-5 h-5" /></button>
                    <button aria-label={translations[lang].delete} onClick={() => onDelete(product)} className="p-2 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition"><Trash2 className="w-5 h-5" /></button>
                </div>
            </div>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [isOfflineMode, setIsOfflineMode] = useState(false);
            const countryCode = useCountry();
            
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [loginCode, setLoginCode] = useState('');
            const [loginError, setLoginError] = useState('');
            const [notification, setNotification] = useState(null);
            
            const [selectedProduct, setSelectedProduct] = useState(null);
            
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [confirmMessage, setConfirmMessage] = useState('');
            const [confirmAction, setConfirmAction] = useState(null);

            const [products, setProducts] = useState([]);
            const [whatsappNumber, setWhatsappNumber] = useState('13155576166');
            
            const [githubConfig, setGithubConfig] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEYS.GITHUB_CONFIG);
                return saved ? JSON.parse(saved) : { token: '', owner: '', repo: '', path: '' };
            });

            const [lang, setLang] = useState('ar');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [sortBy, setSortBy] = useState('default'); 
            const [isDarkMode, setIsDarkMode] = useState(() => {
                if (typeof window !== 'undefined') {
                    const saved = localStorage.getItem(STORAGE_KEYS.DARK_MODE);
                    if (saved !== null) return JSON.parse(saved);
                    return window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                return false;
            });

            const [stats, setStats] = useState({ totalVisits: 0, dailyVisits: 0, topCountries: {} });
            const [isEditing, setIsEditing] = useState(false);
            const [editingProduct, setEditingProduct] = useState(null);
            const [formData, setFormData] = useState({ name: '', category: '', duration: '', price: '', originalPrice: '', usdPrice: '', description: '', imageUrl: '', type: 'bundle' });

            useEffect(() => {
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.documentElement.lang = lang;
            }, [lang]);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem(STORAGE_KEYS.DARK_MODE, JSON.stringify(isDarkMode));
            }, [isDarkMode]);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEYS.GITHUB_CONFIG, JSON.stringify(githubConfig));
            }, [githubConfig]);

            const t = translations[lang];

            const toggleLanguage = () => setLang(prev => prev === 'ar' ? 'en' : 'ar');
            const toggleTheme = () => setIsDarkMode(prev => !prev);

            const filteredProducts = useMemo(() => {
                let result = products.filter(p => {
                    const matchesCategory = selectedCategory === 'All' || p.category === selectedCategory;
                    const matchesSearch = (p.name && p.name.toLowerCase().includes(searchQuery.toLowerCase())) || 
                                          (p.description && p.description.toLowerCase().includes(searchQuery.toLowerCase())) ||
                                          (p.name_en && p.name_en.toLowerCase().includes(searchQuery.toLowerCase()));
                    return matchesCategory && matchesSearch && !p.hidden;
                });
                if (sortBy === 'price_low') result.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
                else if (sortBy === 'price_high') result.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
                return result;
            }, [products, selectedCategory, searchQuery, sortBy]);

            const categories = useMemo(() => ['All', ...new Set(products.map(p => p.category))], [products]);

            const showToast = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const Toast = () => (
                notification && (
                    <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 z-[60] flex items-center gap-2 px-6 py-3 rounded-full shadow-lg transition-all duration-300 ${notification.type === 'error' ? 'bg-red-500 text-white' : 'bg-slate-900 text-white'}`}>
                        {notification.type === 'error' ? <AlertCircle size={18} /> : <CheckCircle size={18} />}
                        <span className="font-bold text-sm">{notification.message}</span>
                    </div>
                )
            );

            const handleHashChange = () => {
                const hash = window.location.hash;
                if (hash.startsWith('#/product/')) {
                    const productId = hash.split('/')[2];
                    const foundProduct = products.find(p => p.id === productId) || DEFAULT_PRODUCTS.find(p => p.id === productId);
                    if (foundProduct) setSelectedProduct(foundProduct); else { setSelectedProduct(null); window.location.hash = ''; }
                } else setSelectedProduct(null);
                window.scrollTo(0, 0);
            };
            
            useEffect(() => { 
                handleHashChange(); 
                window.addEventListener('hashchange', handleHashChange); 
                return () => window.removeEventListener('hashchange', handleHashChange); 
            }, [products]);
            
            const openProductLink = (product) => { window.location.hash = `#/product/${product.id}`; };
            
            const navigateHome = () => { 
                window.location.hash = '';
                setSelectedProduct(null);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            
            const handleCloseProduct = () => { window.location.hash = ''; };

            const openWhatsapp = (data = null) => { 
                let msg = t.helloMsg;
                let trackingName = 'General Inquiry';

                if (data) {
                    if (typeof data === 'string') {
                        msg = `${t.helloMsgProduct} ${data}`;
                        trackingName = data;
                    } else if (typeof data === 'object') {
                        msg = `${t.helloMsgProduct} ${data.name}\n${t.price}: ${data.price}\n${t.duration}: ${data.duration}`;
                        trackingName = data.name;
                    }
                }
                
                if(countryCode) {
                    const countryLabel = countryMap[countryCode] || countryCode;
                    msg += `\n(${t.sentFrom}: ${countryLabel})`; 
                }
                
                trackWhatsAppClick(trackingName);
                window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank'); 
            };

            const handleShare = async (product) => {
                const url = window.location.href.split('#')[0] + `#/product/${product.id}`;
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: product.name,
                            text: product.description,
                            url: url,
                        });
                    } catch (error) {
                        console.log('Error sharing', error);
                    }
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = url;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        showToast(t.shareSuccess);
                    } catch (err) {
                        console.error('Fallback: Oops, unable to copy', err);
                    }
                    document.body.removeChild(textArea);
                }
            };

            const recordVisit = async (country) => {
                const currentTotal = parseInt(localStorage.getItem('local_total_visits') || '0');
                localStorage.setItem('local_total_visits', currentTotal + 1);
                
                const today = new Date().toISOString().split('T')[0];
                const currentDailyKey = `local_daily_${today}`;
                const currentDaily = parseInt(localStorage.getItem(currentDailyKey) || '0');
                localStorage.setItem(currentDailyKey, currentDaily + 1);

                const countriesKey = `local_countries_${today}`;
                const countries = JSON.parse(localStorage.getItem(countriesKey) || '{}');
                countries[country || 'Unknown'] = (countries[country || 'Unknown'] || 0) + 1;
                localStorage.setItem(countriesKey, JSON.stringify(countries));

                if (isOfflineMode || !db) return;
                try {
                    const generalStatsRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'general');
                    const dailyStatsRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', `daily_${today}`);
                    await setDoc(generalStatsRef, { totalVisits: increment(1) }, { merge: true });
                    const countryKey = `countries.${country || 'Unknown'}`;
                    await setDoc(dailyStatsRef, { totalVisits: increment(1), [countryKey]: increment(1), date: today }, { merge: true });
                } catch (error) {}
            };

            useEffect(() => {
                if (!sessionStorage.getItem(STORAGE_KEYS.VISITED)) {
                    if (countryCode) { recordVisit(countryCode); sessionStorage.setItem(STORAGE_KEYS.VISITED, 'true'); }
                }
            }, [countryCode, isOfflineMode]);

            useEffect(() => {
                if (isAdmin) {
                    const today = new Date().toISOString().split('T')[0];
                    if (!isOfflineMode && db) {
                        const unsubGeneral = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'general'), (doc) => {
                            if (doc.exists()) setStats(prev => ({ ...prev, totalVisits: doc.data().totalVisits || 0 }));
                        });
                        const unsubDaily = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'stats', `daily_${today}`), (doc) => {
                            if (doc.exists()) { const data = doc.data(); setStats(prev => ({ ...prev, dailyVisits: data.totalVisits || 0, topCountries: data.countries || {} })); }
                        });
                        return () => { unsubGeneral(); unsubDaily(); };
                    } else {
                        const total = localStorage.getItem('local_total_visits') || 0;
                        const daily = localStorage.getItem(`local_daily_${today}`) || 0;
                        const countries = JSON.parse(localStorage.getItem(`local_countries_${today}`) || '{}');
                        setStats({ totalVisits: total, dailyVisits: daily, topCountries: countries });
                    }
                }
            }, [isAdmin, isOfflineMode]);

            const triggerUpdateImages = () => { setConfirmMessage(t.updateAttempt); setConfirmAction(() => executeUpdateImages); setShowConfirmModal(true); };
            const executeUpdateImages = async () => { setLoading(true); setShowConfirmModal(false); try { showToast(t.saveData); } catch (e) { showToast(getErrorMessage(e, lang), 'error'); } finally { setLoading(false); } }; 
            const triggerDeleteAll = () => { setConfirmMessage(t.deleteAll); setConfirmAction(() => executeDeleteAll); setShowConfirmModal(true); };
            
            // --- UPDATED GITHUB SYNC ---
            const saveToGitHub = async (updatedProducts) => {
                const config = JSON.parse(localStorage.getItem(STORAGE_KEYS.GITHUB_CONFIG) || '{}');
                if (!config.token || !config.owner || !config.repo || !config.path) {
                    console.warn("GitHub config missing");
                    return;
                }

                showToast(t.githubSyncing);

                try {
                    const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`;
                    const getRes = await fetch(url, { headers: { 'Authorization': `token ${config.token}` } });
                    if (!getRes.ok) throw new Error(t.githubError);
                    
                    const fileData = await getRes.json();
                    const currentContent = decodeURIComponent(escape(atob(fileData.content)));
                    
                    const startMarker = '/* PRODUCTS_START */';
                    const endMarker = '/* PRODUCTS_END */';
                    const startIndex = currentContent.indexOf(startMarker) + startMarker.length;
                    const endIndex = currentContent.indexOf(endMarker);
                    
                    if (startIndex === -1 || endIndex === -1) throw new Error("لا توجد علامات تحديد في الكود");
                    
                    const newProductsBlock = `\n        const DEFAULT_PRODUCTS = ${JSON.stringify(updatedProducts, null, 4)};\n    `;
                    const newContent = currentContent.slice(0, startIndex) + newProductsBlock + currentContent.slice(endIndex);
                    
                    const putRes = await fetch(url, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: "Update products from Dashboard",
                            content: btoa(unescape(encodeURIComponent(newContent))),
                            sha: fileData.sha
                        })
                    });

                    if (!putRes.ok) throw new Error(t.githubError);
                    showToast(t.githubSuccess);
                } catch (err) {
                    console.error("GitHub Sync Error:", err);
                    showToast(t.githubError, "error");
                }
            };

            const executeDeleteAll = async () => { setShowConfirmModal(false); setLoading(true); try { if(!isOfflineMode) { const promises = products.map(p => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', p.id))); await Promise.all(promises); } else { setProducts([]); localStorage.removeItem(STORAGE_KEYS.PRODUCTS); } await saveToGitHub([]); showToast(t.delete); } catch(e){ showToast(getErrorMessage(e, lang), 'error'); } finally { setLoading(false); } };
            const handleSeedData = async () => { setLoading(true); try { if(!isOfflineMode) { for(const p of DEFAULT_PRODUCTS) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), p); } else { setProducts(DEFAULT_PRODUCTS.map(p=>({...p, id: Math.random().toString(36).substr(2,9)}))); } showToast(t.restoreData); } catch(e){ showToast(getErrorMessage(e, lang), 'error'); } finally { setLoading(false); } };
            const handleProductSubmit = async (e) => { e.preventDefault(); let newProductsList = [...products]; try { if(!isOfflineMode) { if(editingProduct) { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', editingProduct.id), formData, {merge:true}); newProductsList = newProductsList.map(p => p.id === editingProduct.id ? {...p, ...formData} : p); } else { const ref = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), formData); newProductsList.push({ id: ref.id, ...formData }); } } else { if(editingProduct) { newProductsList = newProductsList.map(p=>p.id===editingProduct.id?{...p,...formData}:p); } else { newProductsList.push({...formData, id: Math.random().toString(36).substr(2,9)}); } setProducts(newProductsList); } await saveToGitHub(newProductsList); setIsEditing(false); showToast(t.saveData); } catch(e){ showToast(getErrorMessage(e, lang), 'error'); } };
            const handleDeleteProduct = (product) => { setConfirmMessage(t.delete + '?'); setConfirmAction(() => async () => { try { let newProductsList = products.filter(p => p.id !== product.id); if(!isOfflineMode) { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', product.id)); } else { setProducts(newProductsList); } await saveToGitHub(newProductsList); showToast(t.delete); } catch(e){ showToast(getErrorMessage(e, lang), 'error'); } setShowConfirmModal(false); }); setShowConfirmModal(true); };
            const handleImageUpload = (e) => { const file = e.target.files[0]; if(file) { if (!file.type.startsWith('image/')) { showToast(t.imageTypeWarning, 'error'); return; } if(file.size > 800 * 1024) { showToast(t.imageSizeWarning, 'error'); return; } const reader = new FileReader(); reader.onloadend = () => setFormData({...formData, imageUrl: reader.result}); reader.readAsDataURL(file); } };
            const handleEditClick = (p) => { setEditingProduct(p); setFormData({name:p.name, category:p.category, duration:p.duration, price:p.price, originalPrice:p.originalPrice||'', usdPrice:p.usdPrice||'', description:p.description, imageUrl:p.imageUrl||'', type:p.type||'bundle'}); setIsEditing(true); };
            const handleAddNewClick = () => { setEditingProduct(null); setFormData({name:'', category:'', duration:'', price:'', originalPrice:'', usdPrice:'', description:'', imageUrl:'', type:'bundle'}); setIsEditing(true); };

            const handleLogin = async (e) => { 
                e.preventDefault(); 
                const input = loginCode.trim();
                let isValid = false;
                try {
                    if (window.crypto && window.crypto.subtle) {
                        const hash = await hashString(input);
                        if (hash === ADMIN_HASH) isValid = true;
                    }
                } catch (err) { console.warn("Crypto check failed:", err); }
                if (!isValid) { try { if (btoa(input) === ADMIN_B64) isValid = true; } catch (err) {} }

                if (isValid) { setIsAdmin(true); setShowLoginModal(false); setLoginCode(''); setLoginError(''); showToast(t.loginTitle); } else { setLoginError(t.loginError); }
            };

            const forceOffline = () => {
                console.warn("Forcing Offline Mode");
                setIsOfflineMode(true);
                setUser({ uid: "offline-user", isAnonymous: true });
                const savedProducts = localStorage.getItem(STORAGE_KEYS.PRODUCTS);
                if (savedProducts) {
                    setProducts(JSON.parse(savedProducts));
                } else {
                    setProducts(DEFAULT_PRODUCTS);
                }
                setLoading(false);
            };

            useEffect(() => {
                const safetyTimer = setTimeout(() => {
                    if (loading) {
                        console.warn("Init Timed out");
                        forceOffline();
                    }
                }, 7000);

                if (isFirebaseConfigured) {
                    const initAuth = async () => {
                        try { 
                            await signInAnonymously(auth); 
                        } catch (error) { 
                            if (error.code === 'auth/admin-restricted-operation' || error.code === 'auth/operation-not-allowed') {
                                console.warn("Anonymous Sign-in restricted. Offline mode activated.");
                                forceOffline();
                            } else {
                                console.error("Auth Error", error);
                                forceOffline();
                            }
                        }
                    };
                    initAuth();
                    const unsubscribe = onAuthStateChanged(auth, (currentUser) => { 
                        if (currentUser) setUser(currentUser); 
                    });
                    return () => {
                        unsubscribe();
                        clearTimeout(safetyTimer);
                    };
                } else { 
                    forceOffline();
                    clearTimeout(safetyTimer);
                }
            }, []);

            useEffect(() => {
                if (isFirebaseConfigured && !isOfflineMode) {
                    if (!user || !db) return;
                    const productsRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
                    const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
                    const unsubProducts = onSnapshot(productsRef, (snapshot) => {
                        const prods = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setProducts(prods); setLoading(false);
                    }, (error) => { 
                        console.error("Snapshot Error", error);
                        setProducts(JSON.parse(localStorage.getItem(STORAGE_KEYS.PRODUCTS)) || DEFAULT_PRODUCTS); 
                        forceOffline();
                    });
                    const unsubSettings = onSnapshot(settingsRef, (docSnap) => { if (docSnap.exists() && docSnap.data().whatsapp) setWhatsappNumber(docSnap.data().whatsapp); });
                    return () => { unsubProducts(); unsubSettings(); };
                } else {
                    setProducts(JSON.parse(localStorage.getItem(STORAGE_KEYS.PRODUCTS)) || DEFAULT_PRODUCTS);
                    if (localStorage.getItem(STORAGE_KEYS.WHATSAPP)) setWhatsappNumber(localStorage.getItem(STORAGE_KEYS.WHATSAPP));
                    setLoading(false);
                }
            }, [user, isOfflineMode]);

            if (loading) {
                return (
                    <div dir={lang === 'ar' ? 'rtl' : 'ltr'} className="min-h-screen bg-slate-50 dark:bg-slate-950 p-8 flex flex-col items-center justify-center">
                        <div className="flex flex-col items-center gap-4 mb-8">
                            <Loader className="w-10 h-10 text-blue-600 animate-spin" />
                            <p className="text-slate-500 dark:text-slate-400 font-bold">{t.loading}</p>
                        </div>
                    </div>
                );
            }

            if (isAdmin) {
                return (
                    <div dir={lang === 'ar' ? 'rtl' : 'ltr'} className="min-h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-200 pb-20">
                        <Toast />
                        <header className="bg-slate-900 dark:bg-slate-950 text-white shadow-lg sticky top-0 z-50 p-4 flex justify-between items-center">
                            <div className="flex items-center gap-2"><LayoutDashboard className="text-blue-400" /><h1 className="text-xl font-bold">{t.dashboard}</h1></div>
                            <div className="flex gap-2">
                                <button onClick={toggleTheme} className="bg-slate-800 p-2 rounded-lg hover:bg-slate-700 transition text-slate-300">{isDarkMode ? <Sun size={20}/> : <Moon size={20}/>}</button>
                                <button onClick={toggleLanguage} className="bg-slate-800 p-2 rounded-lg hover:bg-slate-700 transition flex items-center gap-1 font-bold text-sm text-slate-300"><Globe size={18} /><span>{lang === 'ar' ? 'EN' : 'عربي'}</span></button>
                                <button onClick={() => setIsAdmin(false)} className="bg-slate-800 px-4 py-2 rounded-lg text-sm hover:bg-slate-700 transition text-slate-300">{t.logout}</button>
                            </div>
                        </header>
                        <div className="container mx-auto px-4 py-8 space-y-8">
                            <section className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-slate-500 dark:text-slate-400 text-sm font-bold">{t.totalVisits}</h3>
                                        <div className="bg-blue-100 dark:bg-blue-900/30 p-2 rounded-lg text-blue-600"><Users size={20} /></div>
                                    </div>
                                    <p className="text-3xl font-black text-slate-900 dark:text-white">{stats.totalVisits}</p>
                                </div>
                                <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-slate-500 dark:text-slate-400 text-sm font-bold">{t.dailyVisits}</h3>
                                        <div className="bg-purple-100 dark:bg-purple-900/30 p-2 rounded-lg text-purple-600"><BarChart size={20} /></div>
                                    </div>
                                    <p className="text-3xl font-black text-slate-900 dark:text-white">{stats.dailyVisits}</p>
                                </div>
                                
                                <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-slate-500 dark:text-slate-400 text-sm font-bold">{t.topCountries}</h3>
                                        <div className="bg-green-100 dark:bg-green-900/30 p-2 rounded-lg text-green-600"><MapPin size={20} /></div>
                                    </div>
                                    <div className="space-y-3 max-h-40 overflow-y-auto pr-2 custom-scrollbar">
                                        {Object.keys(stats.topCountries).length > 0 ? (
                                            Object.entries(stats.topCountries)
                                                .sort(([,a], [,b]) => b - a)
                                                .map(([code, count]) => (
                                                    <div key={code} className="flex justify-between items-center text-sm border-b border-slate-50 dark:border-slate-800 pb-2 last:border-0">
                                                        <span className="font-bold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                                                            {countryMap[code] || code}
                                                        </span>
                                                        <span className="bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md text-slate-600 dark:text-slate-400 font-mono font-bold">
                                                            {count}
                                                        </span>
                                                    </div>
                                                ))
                                        ) : (
                                            <p className="text-xs text-slate-400 text-center py-4">--</p>
                                        )}
                                    </div>
                                </div>
                            </section>

                            <section className="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                                <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-slate-900 dark:text-white"><Github size={20}/> {t.githubSettings}</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <input type="password" value={githubConfig.token} onChange={e => setGithubConfig({...githubConfig, token: e.target.value})} className="w-full p-2 border rounded-lg bg-slate-50 dark:bg-slate-800 dark:border-slate-700" placeholder={t.githubToken} />
                                    <input type="text" value={githubConfig.owner} onChange={e => setGithubConfig({...githubConfig, owner: e.target.value})} className="w-full p-2 border rounded-lg bg-slate-50 dark:bg-slate-800 dark:border-slate-700" placeholder={t.githubOwner} />
                                    <input type="text" value={githubConfig.repo} onChange={e => setGithubConfig({...githubConfig, repo: e.target.value})} className="w-full p-2 border rounded-lg bg-slate-50 dark:bg-slate-800 dark:border-slate-700" placeholder={t.githubRepo} />
                                    <input type="text" value={githubConfig.path} onChange={e => setGithubConfig({...githubConfig, path: e.target.value})} className="w-full p-2 border rounded-lg bg-slate-50 dark:bg-slate-800 dark:border-slate-700" placeholder={t.githubPath} />
                                </div>
                                <div className="mt-4">
                                    <button 
                                        onClick={() => {
                                            localStorage.setItem(STORAGE_KEYS.GITHUB_CONFIG, JSON.stringify(githubConfig));
                                            showToast("تم حفظ إعدادات GitHub بنجاح!");
                                        }}
                                        className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition"
                                    >
                                        حفظ إعدادات GitHub
                                    </button>
                                </div>
                            </section>
                            <section className="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                                <div className="flex justify-between mb-6"><h2 className="text-lg font-bold text-slate-900 dark:text-white">{t.manageProducts}</h2><button onClick={handleAddNewClick} className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">{t.addNew}</button></div>
                                {products.length === 0 ? <button onClick={handleSeedData} className="mx-auto bg-blue-100 text-blue-700 px-6 py-3 rounded-lg hover:bg-blue-200 transition">{t.restoreData}</button> : <div className="space-y-3">{products.map(p => <AdminProductItem key={p.id} product={p} onEdit={handleEditClick} onDelete={handleDeleteProduct} lang={lang}/>)}</div>}
                            </section>
                        </div>
                        {isEditing && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                                <div className="bg-white dark:bg-slate-800 w-full max-w-lg rounded-2xl shadow-2xl overflow-y-auto max-h-[90vh]">
                                    <div className="p-6 border-b border-slate-100 dark:border-slate-700 flex justify-between sticky top-0 bg-white dark:bg-slate-800 z-10"><h3 className="text-lg font-bold text-slate-900 dark:text-white">{editingProduct ? t.edit : t.addNew}</h3><button onClick={() => setIsEditing(false)} className="text-slate-500 hover:text-red-500"><X size={24}/></button></div>
                                    <form onSubmit={handleProductSubmit} className="p-6 space-y-4">
                                        <input required placeholder={t.productName} value={formData.name} onChange={e=>setFormData({...formData, name:e.target.value})} className="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                        <input required placeholder={t.category} value={formData.category} onChange={e=>setFormData({...formData, category:e.target.value})} className="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                        
                                        <div>
                                            <label className="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">{t.type}</label>
                                            <select value={formData.type} onChange={e=>setFormData({...formData, type:e.target.value})} className="w-full p-3 border dark:border-slate-600 rounded-xl bg-white dark:bg-slate-700 dark:text-white">
                                                <option value="bundle">{t.bundle}</option>
                                                <option value="single">{t.single}</option>
                                            </select>
                                        </div>

                                        <input placeholder={t.duration} value={formData.duration} onChange={e=>setFormData({...formData, duration:e.target.value})} className="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                        
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">{t.price} ({t.currency})</label>
                                                <input placeholder="199" value={formData.price} onChange={e=>setFormData({...formData, price:e.target.value})} className="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">{t.originalPrice}</label>
                                                <input placeholder="450" value={formData.originalPrice} onChange={e=>setFormData({...formData, originalPrice:e.target.value})} className="w-full p-3 border rounded-xl bg-slate-50 dark:bg-slate-700 dark:border-slate-600 dark:text-white" />
                                            </div>
                                        </div>

                                        <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-100 dark:border-blue-800">
                                            <label className="block text-sm font-bold text-blue-800 dark:text-blue-300 mb-2 flex items-center gap-2">
                                                <Globe size={16} />
                                                {t.internationalPrice} (USD)
                                            </label>
                                            <div className="flex gap-4 items-center">
                                                <input 
                                                    type="number" 
                                                    step="0.01"
                                                    placeholder="e.g. 10" 
                                                    value={formData.usdPrice} 
                                                    onChange={e=>setFormData({...formData, usdPrice:e.target.value})} 
                                                    className="w-full p-2 border dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 dark:text-white" 
                                                />
                                                <div className="text-xs text-slate-500 dark:text-slate-400 min-w-[100px]">
                                                    <p>≈ {((parseFloat(formData.usdPrice)||0) * 3.75).toFixed(0)} {t.sar}</p>
                                                    <p>≈ {((parseFloat(formData.usdPrice)||0) * 3.67).toFixed(0)} {t.aed}</p>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-slate-50 dark:bg-slate-700 p-4 rounded-xl border border-slate-200 dark:border-slate-600">
                                            <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 flex items-center gap-2">
                                                <ImageIcon size={16} className="text-blue-600 dark:text-blue-400" />
                                                {t.imageUpload}
                                            </label>
                                            <div className="flex items-center gap-4 mb-4">
                                                <div className="w-20 h-20 bg-white dark:bg-slate-600 border border-slate-200 dark:border-slate-500 rounded-lg flex items-center justify-center overflow-hidden">
                                                    {formData.imageUrl ? (
                                                        <img src={formData.imageUrl} alt="Preview" className="w-full h-full object-contain" />
                                                    ) : (
                                                        <ImageIcon className="text-slate-300 dark:text-slate-400" />
                                                    )}
                                                </div>
                                                <div className="flex-1">
                                                    <label className="cursor-pointer bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 px-4 py-2 rounded-lg font-bold text-sm hover:bg-blue-200 dark:hover:bg-blue-800 transition inline-flex items-center gap-2">
                                                        <Upload size={16} />
                                                        {t.uploadDevice}
                                                        <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                                                    </label>
                                                    <p className="text-xs text-slate-400 mt-2">{t.imageSizeWarning}</p>
                                                </div>
                                            </div>
                                            <div className="relative">
                                                <span className="absolute top-1/2 -translate-y-1/2 right-3 text-xs font-bold text-slate-400 bg-white dark:bg-slate-600 px-1">{t.orLink}</span>
                                                <input type="url" placeholder="https://example.com/image.png" value={formData.imageUrl} onChange={(e) => setFormData({...formData, imageUrl: e.target.value})} className="w-full p-3 border dark:border-slate-500 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-left text-sm bg-white dark:bg-slate-600 dark:text-white" />
                                            </div>
                                        </div>

                                        <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">{t.saveData}</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <main dir={lang === 'ar' ? 'rtl' : 'ltr'} className="font-sans text-slate-800 dark:text-slate-200 bg-slate-50 dark:bg-slate-950 min-h-screen flex flex-col transition-colors duration-300">
                    <Toast />
                    <nav className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-sm sticky top-0 z-40 p-4 flex justify-between items-center border-b border-slate-100 dark:border-slate-800">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={navigateHome} onDoubleClick={() => setShowLoginModal(true)}>
                            <Zap className="text-blue-600" /> <span className="text-2xl font-black text-slate-900 dark:text-white">Tech Services Store</span>
                        </div>
                        <div className="flex gap-2 items-center">
                            <div className="hidden md:flex items-center gap-2 border-l border-slate-200 dark:border-slate-700 pl-4 ml-4">
                                <a href="https://www.facebook.com/techservicess1" target="_blank" rel="noopener noreferrer" className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition text-blue-600"><Facebook size={20}/></a>
                                <a href="https://www.linkedin.com/company/102599669/admin/dashboard/" target="_blank" rel="noopener noreferrer" className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition text-blue-700"><Linkedin size={20}/></a>
                                <a href="mailto:contact@tech-services.shop" className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition text-red-500"><Mail size={20}/></a>
                            </div>
                            
                            <div className="bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-lg text-lg hidden sm:block" title={`Detected Country: ${countryCode}`}>
                                {countryMap[countryCode]?.split(' ')[0] || '🌍'}
                            </div>

                            <button onClick={toggleTheme} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition text-slate-700 dark:text-slate-300" aria-label={t.toggleTheme}>
                                {isDarkMode ? <Sun size={20}/> : <Moon size={20}/>}
                            </button>
                            <button onClick={toggleLanguage} className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-3 py-2 rounded-lg transition font-bold text-sm" aria-label="Language">
                                <Globe size={18} />
                                <span>{lang === 'ar' ? 'EN' : 'عربي'}</span>
                            </button>
                        </div>
                    </nav>

                    {selectedProduct ? (
                        <ProductDetailsPage product={selectedProduct} onBack={handleCloseProduct} onOrder={openWhatsapp} countryCode={countryCode} onProductSelect={openProductLink} allProducts={products.length>0?products:DEFAULT_PRODUCTS} lang={lang} onShare={handleShare} />
                    ) : (
                        <>
                            <header className="py-20 text-center container mx-auto px-4 animate-fade-in relative">
                                <span className="inline-block bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 px-4 py-1.5 rounded-full text-sm font-bold mb-6 border border-blue-100 dark:border-blue-800 animate-fade-in">
                                    {t.bestValue}
                                </span>
                                <h1 className="text-4xl md:text-6xl font-black mb-6 text-slate-900 dark:text-white leading-relaxed">
                                    {t.heroTitle1}
                                    <span className="text-blue-600 inline-block mx-2 mt-4">{t.heroTitle2}</span>
                                </h1>
                                <p className="text-xl text-slate-500 dark:text-slate-400 mb-8 max-w-2xl mx-auto">{t.heroDesc}</p>
                                <button onClick={() => document.getElementById('products').scrollIntoView({behavior: 'smooth'})} className="bg-blue-600 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition">{t.browseOffers}</button>
                            </header>
                            <section id="products" className="py-12 flex-grow container mx-auto px-4">
                                <div className="text-center mb-10">
                                    <h2 className="text-2xl md:text-3xl font-bold mb-4 text-slate-900 dark:text-white flex items-center justify-center gap-2">
                                        <Layers className="text-blue-600" />
                                        {t.allOffers}
                                    </h2>
                                    <div className="h-1 w-20 bg-blue-600 mx-auto rounded-full mb-4"></div>
                                    <p className="text-slate-500 dark:text-slate-400">{t.chooseOffer}</p>
                                </div>

                                <div className="mb-10 flex flex-col md:flex-row justify-between items-center gap-4 bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors duration-300">
                                    <div className="relative w-full md:w-1/3">
                                        <div className="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none" style={{[lang==='ar'?'right':'left']: '12px'}}>
                                            <Search className="h-5 w-5 text-slate-400 dark:text-slate-500" />
                                        </div>
                                        <input 
                                            type="text" 
                                            className={`w-full ${lang==='ar'?'pr-10':'pl-10'} p-3 rounded-xl border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-blue-500 outline-none transition bg-slate-50 dark:bg-slate-800 focus:bg-white dark:focus:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400`}
                                            placeholder={t.searchPlaceholder}
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                        />
                                    </div>
                                    
                                    <div className="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 no-scrollbar">
                                        {categories.map(cat => (
                                            <button 
                                                key={cat} 
                                                onClick={() => setSelectedCategory(cat)} 
                                                className={`px-4 py-2 rounded-lg border whitespace-nowrap transition ${selectedCategory === cat ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'bg-white text-slate-600 border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'}`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {filteredProducts.length === 0 ? (
                                    <div className="text-center py-20 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-200 dark:border-slate-800">
                                        <Search className="mx-auto text-slate-300 dark:text-slate-600 mb-4" size={48} />
                                        <p className="text-slate-400 dark:text-slate-500 font-bold text-lg">{t.noProducts}</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                        {filteredProducts.map(product => <ProductCard key={product.id} product={product} onViewDetails={openProductLink} countryCode={countryCode} lang={lang} />)}
                                    </div>
                                )}
                            </section>
                        </>
                    )}
                    
                    <footer className="bg-slate-900 dark:bg-slate-950 text-slate-300 py-12 mt-auto border-t border-slate-800">
                        <div className="container mx-auto px-4 text-center">
                            <div className="flex items-center justify-center gap-4 mb-6">
                                <Zap className="text-blue-500 w-6 h-6" />
                                <span className="text-xl font-bold text-white">{t.appTitle}</span>
                            </div>
                            
                            <div className="flex justify-center gap-4 mb-8">
                                <a href="https://www.facebook.com/techservicess1" target="_blank" rel="noopener noreferrer" className="bg-slate-800 hover:bg-blue-600 text-white p-3 rounded-full transition"><Facebook size={20} /></a>
                                <a href="https://www.linkedin.com/company/102599669/admin/dashboard/" target="_blank" rel="noopener noreferrer" className="bg-slate-800 hover:bg-blue-700 text-white p-3 rounded-full transition"><Linkedin size={20} /></a>
                                <a href="mailto:contact@tech-services.shop" className="bg-slate-800 hover:bg-red-500 text-white p-3 rounded-full transition"><Mail size={20} /></a>
                                <button onClick={() => openWhatsapp()} className="bg-slate-800 hover:bg-green-600 text-white p-3 rounded-full transition"><MessageCircle size={20} /></button>
                            </div>

                            <p className="mb-8 max-w-md mx-auto text-sm text-slate-400">{t.footerDesc}</p>
                            <div className="border-t border-slate-800 pt-8 text-sm">
                                &copy; {t.copyright}
                            </div>
                        </div>
                    </footer>

                    {showLoginModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl shadow-2xl p-6 animate-fade-in">
                                <div className="flex justify-between mb-6 items-center">
                                    <h3 className="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2"><Lock className="text-blue-600"/> {t.loginTitle}</h3>
                                    <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-red-500"><X/></button>
                                </div>
                                <form onSubmit={handleLogin}>
                                    <label className="block text-sm text-slate-500 dark:text-slate-400 mb-2">{t.passCode}</label>
                                    <input type="password" value={loginCode} onChange={(e) => setLoginCode(e.target.value)} placeholder="******" className="w-full p-3 border dark:border-slate-600 rounded-xl mb-4 bg-slate-50 dark:bg-slate-700 dark:text-white text-center tracking-[0.5em] font-bold outline-none focus:ring-2 focus:ring-blue-500" autoFocus />
                                    {loginError && <div className="text-red-500 bg-red-50 dark:bg-red-900/20 p-3 rounded-lg text-sm mb-4 flex items-center gap-2"><AlertCircle size={16}/> {loginError}</div>}
                                    <button type="submit" className="w-full bg-slate-900 dark:bg-blue-600 text-white py-3 rounded-xl font-bold hover:opacity-90 transition">{t.enter}</button>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    <button onClick={() => openWhatsapp()} className="md:hidden fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white p-4 rounded-full shadow-xl z-50 transition-transform hover:scale-110 active:scale-95" aria-label="WhatsApp">
                        <MessageCircle size={28} />
                    </button>
                </main>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
