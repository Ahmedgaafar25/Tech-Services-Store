    <!-- Early visit tracking (fires before React loads) - now authenticates anonymously first so it complies with Firestore security rules -->
    <script>
      (function () {
        try {
          if (sessionStorage.getItem("visited")) return;
          var today = new Date().toISOString().split("T")[0];
          var key = "AIzaSyCYMLw1JplZjmgFRk5wswT0KRxVB6gyhsE";
          var authUrl =
            "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" +
            key;
          var base =
            "https://firestore.googleapis.com/v1/projects/store-ba639/databases/(default)/documents";
          var docBase = base + "/artifacts/digital-store-v1/public/data";

          function getGeo() {
            return fetch("https://get.geojs.io/v1/ip/geo.json")
              .then(function (r) {
                if (!r.ok) throw 0;
                return r.json();
              })
              .then(function (g) {
                return {
                  country: (g && g.country) || "Unknown",
                  ip: (g && g.ip) || "",
                };
              })
              .catch(function () {
                return fetch("https://ipwho.is/")
                  .then(function (r) {
                    return r.json();
                  })
                  .then(function (g) {
                    return {
                      country: (g && g.country_code) || "Unknown",
                      ip: (g && g.ip) || "",
                    };
                  })
                  .catch(function () {
                    return { country: "Unknown", ip: "" };
                  });
              });
          }

          Promise.all([
            getGeo(),
            fetch(authUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ returnSecureToken: true }),
            })
              .then(function (r) {
                return r.json();
              })
              .catch(function () {
                return null;
              }),
          ])
            .then(function (results) {
              var geo = results[0],
                authRes = results[1];
              var country = geo.country,
                ip = geo.ip;
              var idToken = authRes && authRes.idToken;
              if (!idToken) return; // no auth = writes will be rejected by security rules, let React handle it later
              var headers = {
                "Content-Type": "application/json",
                Authorization: "Bearer " + idToken,
              };
              fetch(base + ":commit?key=" + key, {
                method: "POST",
                headers: headers,
                body: JSON.stringify({
                  writes: [
                    {
                      transform: {
                        document: docBase + "/stats/general",
                        fieldTransforms: [
                          {
                            fieldPath: "totalVisits",
                            increment: { integerValue: "1" },
                          },
                        ],
                      },
                    },
                    {
                      transform: {
                        document: docBase + "/stats/daily_" + today,
                        fieldTransforms: [
                          {
                            fieldPath: "totalVisits",
                            increment: { integerValue: "1" },
                          },
                          {
                            fieldPath: "countries." + country,
                            increment: { integerValue: "1" },
                          },
                        ],
                      },
                    },
                  ],
                }),
              })
                .then(function (res) {
                  if (res.ok) sessionStorage.setItem("visited", "true");
                })
                .catch(function () {});
              // visit log entry with IP
              fetch(docBase + "/visits?key=" + key, {
                method: "POST",
                headers: headers,
                body: JSON.stringify({
                  fields: {
                    ip: { stringValue: ip },
                    country: { stringValue: country },
                    ua: { stringValue: navigator.userAgent },
                    ts: { integerValue: String(Date.now()) },
                  },
                }),
              }).catch(function () {});
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>

        const [countryCode, setCountryCode] = useState(() => {
          return localStorage.getItem(STORAGE_KEYS.USER_COUNTRY) || "EG";
        });

        useEffect(() => {
          const detectCountry = async () => {
            try {
              const res = await fetch(
                "https://get.geojs.io/v1/ip/country.json",
              );
              if (res.ok) {
                const data = await res.json();
                if (data.country) {
                  setCountryCode(data.country);
                  localStorage.setItem(STORAGE_KEYS.USER_COUNTRY, data.country);
                  return;
                }
              }
            } catch (e) {
              console.warn("GeoJS failed", e);
            }

            try {
              const res = await fetch("https://ipapi.co/json/");
              if (res.ok) {
                const data = await res.json();
                if (data.country_code) {
                  setCountryCode(data.country_code);
                  localStorage.setItem(
                    STORAGE_KEYS.USER_COUNTRY,
                    data.country_code,
                  );
                  return;
                }
              }
            } catch (e) {
              console.warn("ipapi failed", e);
            }
          };

          detectCountry();
        }, []);

        return countryCode;

        if (isNaN(parseFloat(product.price)))
          return { current: product.price, original: null };

        const baseUsd =
          parseFloat(product.usdPrice) || parseFloat(product.price) / 35;
        let originalUsd = null;
        if (product.originalPrice) {
          const discountRatio =
            parseFloat(product.originalPrice) / parseFloat(product.price);
          originalUsd = baseUsd * discountRatio;
        }
        const roundTo5 = (num) => Math.ceil(num / 5) * 5;

        if (countryCode === "EG") {
          return {
            current: `${product.price} ${translations[lang].currency}`,
            original: product.originalPrice
              ? `${product.originalPrice} ${translations[lang].currency}`

        } else {

      const hashString = async (message) => {
        if (!window.crypto || !window.crypto.subtle) return "fallback";
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
      };

      // --- Plain-HTTPS Firestore REST helpers ---
      // The Firebase JS SDK (both onSnapshot AND getDoc/getDocs) talks to Firestore over a
      // persistent "WebChannel" connection. On some mobile networks / carriers / browsers /
      // ad-block or privacy extensions that channel gets silently blocked or returns cached/
      // empty data, while a normal one-shot HTTPS GET to the Firestore REST API works fine
      // (this was verified directly). These helpers bypass the SDK's data channel entirely
      // and talk to the REST API with plain fetch(), reusing the SDK's own auth token.
      const FIRESTORE_REST_BASE = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents`;

      const restFieldToJs = (field) => {
        if (!field) return null;
        if ("stringValue" in field) return field.stringValue;
        if ("integerValue" in field) return parseInt(field.integerValue, 10);
        if ("doubleValue" in field) return field.doubleValue;
        if ("booleanValue" in field) return field.booleanValue;
        if ("mapValue" in field) {
          const obj = {};
          const fields = (field.mapValue && field.mapValue.fields) || {};
          Object.keys(fields).forEach((k) => {
            obj[k] = restFieldToJs(fields[k]);
          });
          return obj;
        }
        if ("arrayValue" in field) {
          const values = (field.arrayValue && field.arrayValue.values) || [];
          return values.map(restFieldToJs);
        }
        if ("nullValue" in field) return null;
        return null;
      };

      const restDocToJs = (doc) => {
        const obj = {};
        const fields = doc.fields || {};
        Object.keys(fields).forEach((k) => {
          obj[k] = restFieldToJs(fields[k]);
        });
        if (doc.name) obj.id = doc.name.split("/").pop();
        return obj;
      };

      const getRestAuthHeaders = async () => {
        try {
          if (auth && auth.currentUser) {
            const token = await auth.currentUser.getIdToken();
            return { Authorization: `Bearer ${token}` };
          }
        } catch (e) {
          console.warn("getIdToken failed", e);
        }
        return {};
      };

      const restGetDoc = async (segments) => {
        const headers = await getRestAuthHeaders();
        const url = `${FIRESTORE_REST_BASE}/${segments.join("/")}?key=${firebaseConfig.apiKey}`;
        const res = await fetch(url, { headers });
        if (!res.ok) {
          if (res.status === 404) return null;
          throw new Error("restGetDoc " + res.status);
        }
        const data = await res.json();
        return restDocToJs(data);
      };

      const restListCollection = async (segments) => {
        const headers = await getRestAuthHeaders();
        let all = [];
        let pageToken = "";
        for (let i = 0; i < 20; i++) {
          // safety cap: up to 20 pages (~6000 docs)
          const url =
            `${FIRESTORE_REST_BASE}/${segments.join("/")}?key=${firebaseConfig.apiKey}&pageSize=300` +
            (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : "");
          const res = await fetch(url, { headers });
          if (!res.ok) throw new Error("restListCollection " + res.status);
          const data = await res.json();
          const docs = (data.documents || []).map(restDocToJs);
          all = all.concat(docs);
          if (!data.nextPageToken) break;
          pageToken = data.nextPageToken;
        }
        return all;
      };

      const restIncrementField = async (segments, fieldPath) => {
        try {
          const headers = {
            "Content-Type": "application/json",
            ...(await getRestAuthHeaders()),
          };
          const docName = `projects/${firebaseConfig.projectId}/databases/(default)/documents/${segments.join("/")}`;
          const commitUrl = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents:commit?key=${firebaseConfig.apiKey}`;
          const res = await fetch(commitUrl, {
            method: "POST",
            headers,
            body: JSON.stringify({
              writes: [
                {
                  transform: {
                    document: docName,
                    fieldTransforms: [
                      { fieldPath, increment: { integerValue: "1" } },
                    ],
                  },
                },
              ],
            }),
          });
          return res.ok;
        } catch (e) {
          console.warn("restIncrementField failed", e);
          return false;

      const HeroCarousel = ({ slides, lang, onSlideClick }) => {
        const [current, setCurrent] = useState(0);
        const touchStartX = React.useRef(null);
        const count = slides.length;
        useEffect(() => {
          if (count <= 1) return;
          const timer = setInterval(
            () => setCurrent((prev) => (prev + 1) % count),
            5000,
          );
          return () => clearInterval(timer);
        }, [count]);
        if (!count) return null;
        const t = translations[lang];
        const goTo = (i) => setCurrent((i + count) % count);
        const onTouchStart = (e) => {
          touchStartX.current = e.touches[0].clientX;
        };
        const onTouchEnd = (e) => {
          if (touchStartX.current === null) return;
          const delta = e.changedTouches[0].clientX - touchStartX.current;
          if (delta > 50) goTo(current - 1);
          else if (delta < -50) goTo(current + 1);
          touchStartX.current = null;
        };
        return (
          <div
            className="relative w-[100vw] left-1/2 -translate-x-1/2 h-56 sm:h-64 md:h-[22rem] overflow-hidden bg-slate-950 shadow-xl group animate-fade-in"
            dir="ltr"
            onTouchStart={onTouchStart}
            onTouchEnd={onTouchEnd}
          >
            <div
              className="flex h-full transition-transform duration-700 ease-in-out"
              style={{ transform: `translateX(-${current * 100}%)` }}
            >
              {slides.map((slide, i) => (
                <div
                  key={slide.id || i}
                  className="w-full h-full flex-shrink-0 relative bg-slate-100"
                >
                  {slide.imageUrl && (
                    <img
                      src={slide.imageUrl}
                      alt={lang === "en" && slide.title_en ? slide.title_en : slide.title}
                      className="w-full h-full object-cover object-left"
                      loading={i === 0 ? "eager" : "lazy"}
                      fetchPriority={i === 0 ? "high" : "auto"}
                      width="1536"
                      height="768"
                      draggable="false"
                    />
                  )}
                  <div className="absolute inset-0 bg-gradient-to-l from-slate-950/95 via-slate-950/65 to-slate-950/5 pointer-events-none"></div>
                  <div
                    dir={lang === "ar" ? "rtl" : "ltr"}

                  >
                    <div className="w-[62%] sm:w-[56%] md:w-[48%] lg:w-[44%] text-right">
                      {(slide.eyebrow || slide.eyebrow_en) && (
                        <span className="inline-flex mb-2 md:mb-3 text-[10px] md:text-xs font-black text-blue-200 tracking-wider">
                          {lang === "en" && slide.eyebrow_en
                            ? slide.eyebrow_en
                            : slide.eyebrow}
                        </span>
                      )}
                      <h2 className="text-lg sm:text-2xl md:text-4xl font-black leading-tight mb-2 md:mb-3 text-white drop-shadow-lg">
                        {lang === "en" && slide.title_en
                          ? slide.title_en
                          : slide.title}
                      </h2>
                      {slide.subtitle && (
                        <p className="text-[11px] sm:text-sm md:text-base leading-relaxed text-slate-100 font-semibold mb-3 md:mb-5 line-clamp-3 drop-shadow">
                          {lang === "en" && slide.subtitle_en
                            ? slide.subtitle_en
                            : slide.subtitle}
                        </p>
                      )}
                      <button
                        onClick={() => onSlideClick(slide)}
                        className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 md:px-6 md:py-3 rounded-xl font-bold shadow-lg hover:shadow-blue-500/30 transition text-[11px] sm:text-sm md:text-base"
                      >
                        {lang === "en" && slide.cta_en
                          ? slide.cta_en
                          : slide.cta || t.viewOffer}
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
            {count > 1 && (
              <>
                <div className="absolute bottom-2.5 left-1/2 -translate-x-1/2 z-20 flex gap-2">
                  {slides.map((_, i) => (
                    <button
                      key={i}
                      onClick={() => goTo(i)}
                      aria-label={"slide " + (i + 1)}
                      className={`w-2 h-2 md:w-2.5 md:h-2.5 rounded-full transition ${i === current ? "bg-white scale-110" : "bg-white/40 hover:bg-white/70"}`}
                    />
                  ))}
                </div>
              </>
            )}
          </div>
        );
      };

      const VisitorsLogPage = ({
        lang,
        onBack,
        isOfflineMode,
        stats,
        productViews,
        products,
      }) => {
        const [visits, setVisits] = useState([]);
        const [loadingVisits, setLoadingVisits] = useState(true);
        const [visitsSource, setVisitsSource] = useState("cloud");
        const t = translations[lang];
        const normalizeCountry = (c) => {
          if (!c) return "Unknown";
          const raw = String(c).trim();
          if (raw.length === 2) return raw.toUpperCase();
          const names = {
            egypt: "EG",
            "saudi arabia": "SA",
            "united arab emirates": "AE",
            kuwait: "KW",
            qatar: "QA",
            bahrain: "BH",
            oman: "OM",
            lebanon: "LB",
            jordan: "JO",
            iraq: "IQ",
            libya: "LY",
            morocco: "MA",
            "united states": "US",
            "united kingdom": "GB",
            germany: "DE",
            france: "FR",
            turkey: "TR",
          };
          return names[raw.toLowerCase()] || raw;
        };

        const fetchVisitsOnce = async () => {
          // Uses a plain HTTPS REST GET (restListCollection), NOT the Firebase SDK's
          // getDocs/onSnapshot data channel. On this app's traffic, the SDK's own
          // WebChannel returns stale/empty/local-only results on some networks & browsers,
          // while the REST endpoint (verified directly) always returns the true server data.
          try {
            const list = await restListCollection([
              "artifacts",
              appId,
              "public",
              "data",
              "visits",
            ]);
            list.forEach((v) => {
              v.country = normalizeCountry(v.country);
            });
            list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
            setVisits(list);
            setVisitsSource("cloud");
            setLoadingVisits(false);
            return true;
          } catch (e) {
            console.warn("restListCollection(visits) failed", e);
            return false;
          }
        };

        useEffect(() => {
          // Always try the public REST API first. Offline mode must not hide cloud visits.
          let cancelled = false;
          const run = async () => {
            const ok = await fetchVisitsOnce();
            if (cancelled) return;
            if (!ok) {
              setVisits(
                JSON.parse(
                  localStorage.getItem("local_visits") || "[]",
                ).reverse(),
              );
              setVisitsSource("local");
              setLoadingVisits(false);
            }
          };
          run();
          const interval = setInterval(run, 15000);
          return () => {
            cancelled = true;
            clearInterval(interval);
          };
        }, []);
        let pv = { ...(productViews || {}) };
        try {
          const localPv = JSON.parse(
            localStorage.getItem("local_product_views") || "{}",
          );
          Object.keys(localPv).forEach((id) => {
            pv[id] = Math.max(pv[id] || 0, localPv[id] || 0);
          });
        } catch (e) {}
        const pvRows = (products || [])
          .map((p) => ({ p, views: pv[p.id] || 0 }))
          .sort((a, b) => b.views - a.views);
        const maxViews = Math.max(1, ...pvRows.map((r) => r.views));
        const topCountries = Object.entries(stats?.topCountries || {})
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);
        return (
          <div
            dir={lang === "ar" ? "rtl" : "ltr"}
            className="min-h-screen bg-slate-50 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-200 pb-20"
          >
            <header className="bg-slate-900 dark:bg-slate-950 text-white shadow-lg sticky top-0 z-50 p-4 flex justify-between items-center">
              <div className="flex items-center gap-2">
                <Users className="text-blue-400" />
                <h1 className="text-xl font-bold">{t.visitorsLog}</h1>
                <span
                  className={`text-[10px] px-2 py-0.5 rounded-full ${visitsSource === "cloud" ? "bg-green-600/30 text-green-300" : "bg-amber-600/30 text-amber-200"}`}
                >
                  {visitsSource === "cloud"
                    ? lang === "ar"
                      ? "من السحابة"
                      : "Cloud"
                    : lang === "ar"
                      ? "هذا الجهاز فقط"
                      : "This device only"}
                </span>
              </div>
              <button
                onClick={onBack}
                className="bg-slate-800 px-4 py-2 rounded-lg text-sm hover:bg-slate-700 transition text-slate-300"
              >
                {t.backToDashboard}
              </button>
            </header>
            <div className="container mx-auto px-4 py-8 space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                  <h3 className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-1">
                    {t.totalVisits}
                  </h3>
                  <p className="text-3xl font-black text-slate-900 dark:text-white">
                    {stats?.totalVisits || 0}
                  </p>
                </div>
                <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                  <h3 className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-1">
                    {t.dailyVisits}
                  </h3>
                  <p className="text-3xl font-black text-slate-900 dark:text-white">
                    {stats?.dailyVisits || 0}
                  </p>
                </div>
                <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
                  <h3 className="text-slate-500 dark:text-slate-400 text-sm font-bold mb-2">
                    {t.topCountries}

                  {topCountries.length ? (

                          dir="ltr"

                      </div>
                    ))

                  )}
                </div>
              </div>
              <div className="admin-subtle p-4 rounded-2xl">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-slate-900 dark:text-white">
                  <BarChart size={20} /> {t.productViews}
                </h2>
                {pvRows.length === 0 ? (
                  <p className="text-slate-400 text-center py-4">
                    {t.noVisitors}
                  </p>
                ) : (
                  <div className="space-y-2">
                    {pvRows.map(({ p, views }) => (
                      <div key={p.id} className="flex items-center gap-3">
                        <span className="text-sm font-bold text-slate-700 dark:text-slate-300 w-36 md:w-64 truncate">

                        <span
                          className="text-sm font-black text-blue-600 dark:text-blue-400 w-10 text-left"
                          dir="ltr"
                        >
                          {views}
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
                <div className="p-4 border-b border-slate-100 dark:border-slate-800 font-bold text-slate-700 dark:text-slate-300">
                  {t.visitorsLog} ({visits.length})

                {loadingVisits ? (
                  <div className="p-8 text-center">

                  <div className="divide-y divide-slate-100 dark:divide-slate-800">
                    {visits.slice(0, 300).map((v, i) => (
                      <div
                        key={i}
                        className="p-4 flex flex-col md:flex-row md:items-center gap-1 md:gap-6 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition"
                      >
                        <div

        const saveToGitHub = async (updatedProducts) => {
          const config = JSON.parse(
            localStorage.getItem(STORAGE_KEYS.GITHUB_CONFIG) || "{}",
          );
          if (!config.token || !config.owner || !config.repo || !config.path) {
            console.warn("GitHub config missing");
            return;
          }

          showToast(t.githubSyncing);

          const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`;

          try {
            // 1. جلب بيانات الملف للحصول على الـ SHA ورابط التحميل
            const getRes = await fetch(url, {
              method: "GET",
              headers: { Authorization: `token ${config.token}` },
            });

            if (!getRes.ok) throw new Error("فشل قراءة الملف من GitHub.");

            const fileData = await getRes.json();
            const currentSha = fileData.sha;

            // 2. قراءة محتوى الملف كنص خام (Raw Text) لتجنب مشاكل التشفير وحجم الصور
            const rawRes = await fetch(fileData.download_url, {
              cache: "no-store",
            });
            const currentContent = await rawRes.text();

            // 3. تحديد العلامات المرجعية
            const startMarker = "/* PRODUCTS_START */";
            const endMarker = "/* PRODUCTS_END */";

            const startIndex =
              currentContent.indexOf(startMarker) + startMarker.length;
            const endIndex = currentContent.indexOf(endMarker);

            if (startIndex === -1 || endIndex === -1) {
              throw new Error("لا توجد علامات تحديد في الكود المجلوب");
            }

            // 4. استبدال مصفوفة المنتجات
            const newProductsBlock = `\n        const DEFAULT_PRODUCTS = ${JSON.stringify(updatedProducts, null, 4)};\n        `;
            const newContent =
              currentContent.slice(0, startIndex) +
              newProductsBlock +
              currentContent.slice(endIndex);

            // 5. رفع الكود المحدث مع الـ sha
            const putRes = await fetch(url, {
              method: "PUT",
              headers: {
                Authorization: `token ${config.token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                message: "Update products from Dashboard",
                content: btoa(unescape(encodeURIComponent(newContent))),
                sha: currentSha,
              }),
            });

            if (!putRes.ok) throw new Error(t.githubError);
            showToast(t.githubSuccess);
          } catch (err) {
            console.error("GitHub Sync Error:", err);
            showToast(t.githubError, "error");
          }
        };

        const saveWhatsappToGitHub = async (updatedWhatsapp) => {
          const config = JSON.parse(
            localStorage.getItem(STORAGE_KEYS.GITHUB_CONFIG) || "{}",
          );

          if (!config.token || !config.owner || !config.repo || !config.path) {
            showToast("يرجى ضبط إعدادات GitHub أولاً", "error");
            return { ok: false, reason: "missing-config" };
          }

          try {
            showToast(t.githubSyncing);

            const baseUrl = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`;
            const getUrl = `${baseUrl}?t=${Date.now()}`;
            const getRes = await fetch(getUrl, {
              headers: {
                Authorization: `token ${config.token}`,
                Accept: "application/vnd.github+json",
                "Cache-Control": "no-cache",
              },
            });

            if (!getRes.ok) {
              throw new Error(`GitHub GET failed: ${getRes.status}`);
            }

            const fileData = await getRes.json();
            const normalizedContent = (fileData.content || "").replace(
              /\n/g,
              "",
            );
            let currentContent = decodeURIComponent(
              escape(atob(normalizedContent)),
            );
            const whatsappRegex =
              /const\s+DEFAULT_WHATSAPP_NUMBER\s*=\s*['"`][^'"`]*['"`]\s*;/;

            if (!whatsappRegex.test(currentContent)) {
              throw new Error(
                "لم يتم العثور على DEFAULT_WHATSAPP_NUMBER داخل الملف",
              );
            }

            currentContent = currentContent.replace(
              whatsappRegex,
              `const DEFAULT_WHATSAPP_NUMBER = '${String(updatedWhatsapp).trim()}';`,
            );

            const putRes = await fetch(baseUrl, {
              method: "PUT",
              headers: {
                Authorization: `token ${config.token}`,
                "Content-Type": "application/json",
                Accept: "application/vnd.github+json",
              },
              body: JSON.stringify({
                message: "Dashboard sync: WhatsApp updated",
                content: btoa(unescape(encodeURIComponent(currentContent))),
                sha: fileData.sha,
              }),
            });

            if (!putRes.ok) {
              const errText = await putRes.text();
              throw new Error(`GitHub PUT failed: ${putRes.status} ${errText}`);
            }

            showToast(t.githubSuccess);
            return { ok: true };
          } catch (err) {
            console.error("GitHub WhatsApp Sync Error:", err);
            showToast(err.message || t.githubError, "error");
            return { ok: false, reason: err.message };
          }
        };

              .split("\n")
              .map((s) => s.trim())
              .filter(Boolean),
            features_en: String(formData.features_en || "")
              .split("\n")
              .map((s) => s.trim())
              .filter(Boolean),
          };
          let newProductsList = [...products];
          try {
            if (!isOfflineMode) {
              if (editingProduct) {
                await setDoc(
                  doc(
                    db,
                    "artifacts",
                    appId,
                    "public",
                    "data",
                    "products",
                    editingProduct.id,
                  ),
                  submitData,
                  { merge: true },
                );
                newProductsList = newProductsList.map((p) =>
                  p.id === editingProduct.id ? { ...p, ...submitData } : p,
                );
              } else {
                const ref = await addDoc(
                  collection(
                    db,
                    "artifacts",
                    appId,
                    "public",
                    "data",
                    "products",
                  ),
                  submitData,
                );
                newProductsList.push({ id: ref.id, ...submitData });
              }
            } else {
              if (editingProduct) {
                newProductsList = newProductsList.map((p) =>
                  p.id === editingProduct.id ? { ...p, ...submitData } : p,
                );
              } else {
                newProductsList.push({
                  ...submitData,
                  id: Math.random().toString(36).substr(2, 9),
                });
              }
              setProducts(newProductsList);
            }
            const syncResult = await saveToGitHub(newProductsList);
            setIsEditing(false);
            if (syncResult?.ok) showToast(t.saveData);
          } catch (e) {
            showToast(getErrorMessage(e, lang), "error");
          }
        };
        const saveSlidesToGitHub = async (updatedSlides) => {
          const config = JSON.parse(
            localStorage.getItem(STORAGE_KEYS.GITHUB_CONFIG) || "{}",
          );
          if (!config.token || !config.owner || !config.repo || !config.path)
            return;
          showToast(t.githubSyncing);
          const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`;
          try {
            const getRes = await fetch(url, {
              headers: { Authorization: `token ${config.token}` },
            });
            if (!getRes.ok) throw new Error("read fail");
            const fileData = await getRes.json();
            const rawRes = await fetch(fileData.download_url, {
              cache: "no-store",
            });
            const currentContent = await rawRes.text();
            const startMarker = "/* SLIDES_START */";
            const endMarker = "/* SLIDES_END */";
            const startIndex =
              currentContent.indexOf(startMarker) + startMarker.length;
            const endIndex = currentContent.indexOf(endMarker);
            if (startIndex < startMarker.length || endIndex === -1)
              throw new Error("markers missing");
            const newBlock = `\n        const DEFAULT_SLIDES = ${JSON.stringify(updatedSlides, null, 4)};\n        `;
            const newContent =
              currentContent.slice(0, startIndex) +
              newBlock +
              currentContent.slice(endIndex);
            const putRes = await fetch(url, {
              method: "PUT",
              headers: {
                Authorization: `token ${config.token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                message: "Update slider from Dashboard",
                content: btoa(unescape(encodeURIComponent(newContent))),
                sha: fileData.sha,
              }),
            });
            if (!putRes.ok) throw new Error("put fail");
            showToast(t.githubSuccess);
          } catch (err) {
            console.error("GitHub Slides Sync Error:", err);
            showToast(t.githubError, "error");
          }
        };

        const handleSaveSlides = async (updatedSlides) => {
          setSlides(updatedSlides);
          localStorage.setItem(
            STORAGE_KEYS.SLIDES,
            JSON.stringify(updatedSlides),
          );
          try {
            if (!isOfflineMode && db)
              await setDoc(
                doc(
                  db,
                  "artifacts",
                  appId,
                  "public",
                  "data",
                  "settings",
                  "config",
                ),
                { slides: updatedSlides },
                { merge: true },
              );
            await saveSlidesToGitHub(updatedSlides);
            showToast(t.saveData);
          } catch (e) {
            showToast(getErrorMessage(e, lang), "error");
          }
        };

        const handleSaveSlide = () => {
          if (!slideForm.title) return;
          let updated;
          if (editingSlideId) {
            updated = slides.map((s) =>
              s.id === editingSlideId ? { ...s, ...slideForm } : s,
            );
          } else {
            if (slides.length >= 5) return;
            updated = [...slides, { ...slideForm, id: "slide_" + Date.now() }];
          }
          handleSaveSlides(updated);
          setSlideForm({
            title: "",
            title_en: "",
            subtitle: "",
            subtitle_en: "",
            imageUrl: "",
            productId: "",
          });
          setEditingSlideId(null);
        };

        const handleEditSlide = (slide) => {
          setSlideForm({
            title: slide.title || "",
            title_en: slide.title_en || "",
            subtitle: slide.subtitle || "",
            subtitle_en: slide.subtitle_en || "",
            imageUrl: slide.imageUrl || "",
            productId: slide.productId || "",
          });
          setEditingSlideId(slide.id);
        };

        const handleCancelEditSlide = () => {
          setSlideForm({
            title: "",
            title_en: "",
            subtitle: "",
            subtitle_en: "",
            imageUrl: "",
            productId: "",
          });
          setEditingSlideId(null);
        };

        const handleMoveSlide = (id, dir) => {
          const idx = slides.findIndex((s) => s.id === id);
          const target = idx + dir;
          if (idx === -1 || target < 0 || target >= slides.length) return;
          const updated = [...slides];
          [updated[idx], updated[target]] = [updated[target], updated[idx]];
          handleSaveSlides(updated);
        };

        const handleDeleteSlide = (id) => {
          handleSaveSlides(slides.filter((s) => s.id !== id));
        };

        const handleSlideClick = (slide) => {
          if (slide.productId) {
            const linked = products.find((p) => p.id === slide.productId);
            if (linked) {
              openProductLink(linked);
              return;
            }
          }
          document
            .getElementById("products")
            ?.scrollIntoView({ behavior: "smooth" });
        };

        const handleDropProduct = async (draggedId, targetId) => {
          const fromIdx = products.findIndex((p) => p.id === draggedId);
          const toIdx = products.findIndex((p) => p.id === targetId);
          if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
          const updated = [...products];
          const [moved] = updated.splice(fromIdx, 1);
          updated.splice(toIdx, 0, moved);
          setProducts(updated);
          try {
            if (!isOfflineMode && db)
              await setDoc(
                doc(
                  db,
                  "artifacts",
                  appId,
                  "public",
                  "data",
                  "settings",
                  "config",
                ),
                { productsOrder: updated.map((p) => p.id) },
                { merge: true },
              );
            await saveToGitHub(updated);
            showToast(t.saveData);
          } catch (e) {
            showToast(getErrorMessage(e, lang), "error");
          }
        };

        const handleTouchStartItem = (id) => {
          setTouchDragId(id);
          setTouchOverId(null);
        };

        useEffect(() => {
          if (!touchDragId) return;
          const onTouchMove = (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            const card = el && el.closest("[data-product-id]");
            const overId = card ? card.getAttribute("data-product-id") : null;
            setTouchOverId(overId && overId !== touchDragId ? overId : null);
          };
          const onTouchEnd = () => {
            if (touchOverId) handleDropProduct(touchDragId, touchOverId);
            setTouchDragId(null);
            setTouchOverId(null);
          };
          document.addEventListener("touchmove", onTouchMove, {
            passive: false,
          });
          document.addEventListener("touchend", onTouchEnd);
          document.addEventListener("touchcancel", onTouchEnd);
          return () => {
            document.removeEventListener("touchmove", onTouchMove);
            document.removeEventListener("touchend", onTouchEnd);
            document.removeEventListener("touchcancel", onTouchEnd);
          };
        }, [touchDragId, touchOverId, products]);

        const handleToggleUnavailable = async (product) => {
          const updated = { ...product, unavailable: !product.unavailable };
          const newProductsList = products.map((p) =>
            p.id === product.id ? updated : p,
          );
          try {
            if (!isOfflineMode) {
              await setDoc(
                doc(
                  db,
                  "artifacts",
                  appId,
                  "public",
                  "data",
                  "products",
                  product.id,
                ),
                { unavailable: updated.unavailable },
                { merge: true },
              );
            }
            setProducts(newProductsList);
            const syncResult = await saveToGitHub(newProductsList);
            showToast(
              updated.unavailable ? t.markUnavailable : t.markAvailable,
            );
          } catch (e) {
            showToast(getErrorMessage(e, lang), "error");
          }
        };
        const handleDeleteProduct = (product) => {
          setConfirmMessage(t.delete + "?");
          setConfirmAction(() => async () => {
            try {
              let newProductsList = products.filter((p) => p.id !== product.id);
              if (!isOfflineMode) {
                await deleteDoc(
                  doc(
                    db,
                    "artifacts",
                    appId,
                    "public",
                    "data",
                    "products",

                setProducts(newProductsList);

              const syncResult = await saveToGitHub(newProductsList);
              if (syncResult?.ok) showToast(t.delete);
            } catch (e) {
              showToast(getErrorMessage(e, lang), "error");
            }
            setShowConfirmModal(false);
          });
          setShowConfirmModal(true);
        };
        const handleImageUpload = (e) => {
          const file = e.target.files[0];
          if (file) {
            if (!file.type.startsWith("image/")) {
              showToast(t.imageTypeWarning, "error");
              return;
            }
            if (file.size > 800 * 1024) {
              showToast(t.imageSizeWarning, "error");
              return;
            }
            const reader = new FileReader();
            reader.onloadend = () =>
              setFormData({ ...formData, imageUrl: reader.result });
            reader.readAsDataURL(file);
          }
        };
        const handleEditClick = (p) => {
          setEditingProduct(p);
          setFormData({
            name: p.name,
            category: p.category,
            duration: p.duration,
            price: p.price,

            description: p.description,
            imageUrl: p.imageUrl || "",
            type: p.type || "bundle",
            features: (p.features || []).join("\n"),

          setIsEditing(true);
        };
        const handleAddNewClick = () => {

          setFormData({

            category: "",
            duration: "",
            price: "",
            originalPrice: "",
            usdPrice: "",

            imageUrl: "",
            type: "bundle",

          setIsEditing(true);
        };

        const handleLogin = async (e) => {
          e.preventDefault();
          const input = loginCode.trim();
          let isValid = false;
          try {
            if (window.crypto && window.crypto.subtle) {
              const hash = await hashString(input);
              if (hash === ADMIN_HASH) isValid = true;
            }
          } catch (err) {
            console.warn("Crypto check failed:", err);
          }
          if (!isValid) {
            try {
              if (btoa(input) === ADMIN_B64) isValid = true;
            } catch (err) {}
          }

          if (isValid) {
            setIsAdmin(true);
            try {
              localStorage.setItem(ADMIN_SESSION_KEY, "1");
            } catch (e) {}
            window.location.hash = "#/admin";
            setShowLoginModal(false);
            setLoginCode("");
            setLoginError("");
            showToast(t.loginTitle);
          } else {
            setLoginError(t.loginError);
          }
        };

        const forceOffline = () => {
          console.warn("Forcing Offline Mode");
          setIsOfflineMode(true);
          setUser({ uid: "offline-user", isAnonymous: true });
          const savedProducts = localStorage.getItem(STORAGE_KEYS.PRODUCTS);
          if (savedProducts) {
            setProducts(JSON.parse(savedProducts));
          } else {
            setProducts(DEFAULT_PRODUCTS);
          }
          setLoading(false);
        };

        useEffect(() => {
          const safetyTimer = setTimeout(() => {
            if (loading) {
              console.warn("Init Timed out");
              forceOffline();
            }
          }, 7000);

          if (isFirebaseConfigured) {
            const initAuth = async () => {
              try {
                await signInAnonymously(auth);
              } catch (error) {
                if (
                  error.code === "auth/admin-restricted-operation" ||
                  error.code === "auth/operation-not-allowed"
                ) {
                  console.warn(
                    "Anonymous Sign-in restricted. Offline mode activated.",
                  );
                  forceOffline();
                } else {
                  console.error("Auth Error", error);
                  forceOffline();
                }
              }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              if (currentUser) setUser(currentUser);
            });
            return () => {
              unsubscribe();
              clearTimeout(safetyTimer);
            };
          } else {
            forceOffline();
            clearTimeout(safetyTimer);
          }
        }, []);

        useEffect(() => {
          if (isFirebaseConfigured && !isOfflineMode) {
            if (!user || !db) return;
            const productsRef = collection(
              db,
              "artifacts",
              appId,
              "public",
              "data",
              "products",
            );
            const settingsRef = doc(
              db,
              "artifacts",
              appId,
              "public",
              "data",
              "settings",
              "config",
            );
            let savedOrder = [];
            const applyOrder = (prods) => {
              if (savedOrder.length) {
                const map = new Map(prods.map((p) => [p.id, p]));
                const ordered = savedOrder
                  .map((id) => map.get(id))
                  .filter(Boolean);
                const rest = prods.filter((p) => !savedOrder.includes(p.id));
                return [...ordered, ...rest];
              }
              return prods;
            };

            let resolvedInitial = false;
            // Reliable one-shot REST fetch FIRST: guarantees the app loads with real
            // server data even when the SDK's onSnapshot WebChannel is silently blocked
            // by the network (carrier proxy / privacy extension / restrictive browser).
            // Previously, a blocked onSnapshot here called forceOffline(), which then
            // wrongly kept the ENTIRE app (visit recording + admin stats) in permanent
            // localStorage-only mode - this was the real cause of "only my own visits".
            (async () => {
              try {
                const [prodDocs, settingsDoc] = await Promise.all([
                  restListCollection([
                    "artifacts",
                    appId,
                    "public",
                    "data",
                    "products",
                  ]),
                  restGetDoc([
                    "artifacts",
                    appId,
                    "public",
                    "data",
                    "settings",
                    "config",
                  ]),
                ]);
                if (settingsDoc && Array.isArray(settingsDoc.productsOrder))
                  savedOrder = settingsDoc.productsOrder;
                if (settingsDoc && settingsDoc.whatsapp)
                  setWhatsappNumber(settingsDoc.whatsapp);
                else setWhatsappNumber(DEFAULT_WHATSAPP_NUMBER);
                if (
                  settingsDoc &&
                  Array.isArray(settingsDoc.slides) &&
                  settingsDoc.slides.length
                )
                  setSlides(normalizeSlides(settingsDoc.slides));
                else setSlides(DEFAULT_SLIDES);
                if (prodDocs.length) setProducts(applyOrder(prodDocs));
                resolvedInitial = true;
                setLoading(false);
              } catch (e) {
                console.warn("REST initial products/settings fetch failed", e);
              }
            })();

            const unsubProducts = onSnapshot(
              productsRef,
              (snapshot) => {
                const prods = snapshot.docs.map((doc) => ({
                  id: doc.id,
                  ...doc.data(),
                }));
                setProducts(applyOrder(prods));
                setLoading(false);
              },
              (error) => {
                // Do NOT forceOffline() here: REST already loaded (or will load) real
                // data above. onSnapshot is a "nice-to-have" for live updates only.
                console.warn(
                  "onSnapshot(products) blocked - relying on REST fetch instead",
                  error,
                );
                if (!resolvedInitial) {
                  setProducts(
                    JSON.parse(localStorage.getItem(STORAGE_KEYS.PRODUCTS)) ||
                      DEFAULT_PRODUCTS,
                  );
                  setLoading(false);
                }
              },
            );
            const unsubSettings = onSnapshot(
              settingsRef,
              (docSnap) => {
                if (
                  docSnap.exists() &&
                  Array.isArray(docSnap.data().productsOrder)
                )
                  savedOrder = docSnap.data().productsOrder;
                if (docSnap.exists() && docSnap.data().whatsapp)
                  setWhatsappNumber(docSnap.data().whatsapp);
                else setWhatsappNumber(DEFAULT_WHATSAPP_NUMBER);
                if (
                  docSnap.exists() &&
                  Array.isArray(docSnap.data().slides) &&
                  docSnap.data().slides.length
                )
                  setSlides(normalizeSlides(docSnap.data().slides));
                else if (docSnap.exists()) setSlides(DEFAULT_SLIDES);
              },
              (error) => {
                console.warn("onSnapshot(settings) blocked", error);
              },
            );
            return () => {
              unsubProducts();
              unsubSettings();
            };
          } else {
            setProducts(
              JSON.parse(localStorage.getItem(STORAGE_KEYS.PRODUCTS)) ||
                DEFAULT_PRODUCTS,
            );
            if (localStorage.getItem(STORAGE_KEYS.WHATSAPP))
              setWhatsappNumber(localStorage.getItem(STORAGE_KEYS.WHATSAPP));
            else setWhatsappNumber(DEFAULT_WHATSAPP_NUMBER);
            setSlides(
              normalizeSlides(
                JSON.parse(localStorage.getItem(STORAGE_KEYS.SLIDES)) ||
                  DEFAULT_SLIDES,
              ),
            );
            setLoading(false);
          }
        }, [user, isOfflineMode]);

        if (loading) {
          return (
            <div
              dir={lang === "ar" ? "rtl" : "ltr"}
              className="min-h-screen bg-slate-50 dark:bg-slate-950 p-8 flex flex-col items-center justify-center"
            >

                  {t.loading}
                </p>

            </div>
          );

        if (isAdmin) {

                onBack={() => {

                  window.location.hash = "#/admin";

                productViews={productViews}
                products={products}

          return (
            <div

              className="admin-shell min-h-screen font-sans pb-24 md:pb-10"
            >
              <Toast />
              <header className="sticky top-0 z-50 bg-white/65 dark:bg-slate-950/65 backdrop-blur-xl border-b border-white/70 dark:border-slate-800/70">
                <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
                  <div className="flex items-center gap-2 min-w-0">
                    <div className="size-9 rounded-xl bg-[#1b2340] text-white grid place-items-center">
                      <LayoutDashboard size={18} />
                    </div>
                    <div className="min-w-0">
                      <h1 className="font-black text-slate-900 dark:text-white truncate">
                        {t.dashboard}
                      </h1>
                      <p className="text-[10px] text-slate-500">
                        Tech Services Store
                      </p>
                    </div>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={toggleTheme}
                      aria-label={t.toggleTheme}
                      className="size-9 admin-subtle rounded-xl grid place-items-center text-slate-600 dark:text-slate-300"
                    >
                      {isDarkMode ? <Sun size={17} /> : <Moon size={17} />}
                    </button>
                    <button
                      onClick={toggleLanguage}
                      className="h-9 px-2.5 admin-subtle rounded-xl flex items-center gap-1 font-bold text-xs text-slate-600 dark:text-slate-300"
                    >
                      <Globe size={15} />
                      <span>{lang === "ar" ? "EN" : "عربي"}</span>
                    </button>
                    <button
                      onClick={() => {
                        try {
                          localStorage.removeItem(ADMIN_SESSION_KEY);
                        } catch (e) {}
                        setIsAdmin(false);
                        setShowVisitorsPage(false);
                        window.location.hash = "";
                      }}
                      aria-label={t.logout}
                      className="size-9 rounded-xl bg-rose-100 text-rose-600 grid place-items-center"
                    >
                      <LogOut size={17} />
                    </button>
                  </div>
                </div>
                <nav className="admin-nav max-w-7xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto">
                  <button
                    onClick={() =>
                      document
                        .getElementById("admin-overview")

                    className="shrink-0 px-3 h-8 rounded-lg bg-blue-600 text-white text-xs font-bold"
                  >
                    {lang === "ar" ? "نظرة عامة" : "Overview"}
                  </button>
                  <button
                    onClick={() =>
                      document
                        .getElementById("admin-products")
                        ?.scrollIntoView({ behavior: "smooth" })

                    className="shrink-0 px-3 h-8 rounded-lg admin-subtle text-xs font-bold"
                  >
                    {t.manageProducts}

                  <button
                    onClick={() =>
                      document

                    className="shrink-0 px-3 h-8 rounded-lg admin-subtle text-xs font-bold"
                  >
                    {t.manageSlides}

                  <button
                    onClick={() =>
                      document

                  >
                    {t.settings}

                  <button
                    onClick={() => {
                      setShowVisitorsPage(true);
                      window.location.hash = "#/admin/visitors";
                    }}
                    className="shrink-0 px-3 h-8 rounded-lg admin-subtle text-xs font-bold flex items-center gap-1"
                  >
                    <Users size={14} />
                    {t.visitorsLog}
                  </button>
                </nav>
              </header>
              <div className="max-w-7xl mx-auto px-4 py-5 md:py-8 space-y-5">
                <section
                  id="admin-overview"
                  className="admin-glass scroll-mt-32 rounded-[28px] p-4 md:p-6"
                >
                  <div className="flex items-center justify-between mb-4">
                    <div>
                      <h2 className="text-lg font-black text-slate-900 dark:text-white">
                        {lang === "ar" ? "نظرة عامة" : "Overview"}
                      </h2>
                      <p className="text-xs text-slate-500 mt-1">

                      </p>
                    </div>
                    <button
                      onClick={handleAddNewClick}

                    >
                      <Plus size={16} />
                      {t.addNew}
                    </button>
                  </div>
                  <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                    <div className="admin-subtle p-4 rounded-2xl">
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="text-slate-500 dark:text-slate-400 text-sm font-bold">
                          {t.totalVisits}
                        </h3>
                        <div className="bg-blue-100 dark:bg-blue-900/30 p-2 rounded-lg text-blue-600">

                        </div>
                      </div>
